<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>REAL CITY: LIFE OF A LEGEND - FIXED CONTROLS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; background: #0b1329; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas3d { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; z-index: 0; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
    .joy-stick-base { width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(56, 189, 248, 0.5); position: absolute; pointer-events: none; display: none; transform: translate(-50%, -50%); z-index: 30; }
    .joy-stick-thumb { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%); position: absolute; transform: translate(-50%, -50%); left: 50%; top: 50%; box-shadow: 0 0 15px #0284c7; }
  </style>
</head>
<body class="relative text-white">

  <canvas id="canvas3d"></canvas>

  <!-- HUD INTERFACE -->
  <div id="hud" class="fixed inset-0 pointer-events-none flex flex-col justify-between p-3 sm:p-5 z-10">
    <div class="flex justify-between items-start gap-2">
      <!-- Status & Cash -->
      <div class="glass px-4 py-2.5 rounded-2xl flex flex-col gap-0.5 pointer-events-auto">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="playerStateTag" class="text-[11px] font-black uppercase tracking-wider text-cyan-300">ON FOOT</span>
        </div>
        <div class="text-base sm:text-xl font-black text-emerald-400" id="hudCash">₹ 2,500</div>
      </div>

      <!-- Mission Info -->
      <div class="glass px-4 py-2 rounded-2xl max-w-xs text-center border-amber-400/40 pointer-events-auto">
        <div class="text-[10px] font-black uppercase text-amber-300 tracking-wider flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span> ACTIVE CONTRACT
        </div>
        <div id="missionTargetText" class="text-xs text-slate-200 font-semibold mt-0.5">Drive car into the yellow glowing checkpoint.</div>
      </div>

      <!-- Controls & Speed -->
      <div class="flex flex-col items-end gap-2 pointer-events-auto">
        <button onclick="resetPosition()" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300 active:scale-95 transition">
          ↺ RESET
        </button>
        <div id="speedHud" class="glass px-3.5 py-2 rounded-xl text-right hidden">
          <div class="text-[9px] uppercase font-bold text-slate-400">Speed</div>
          <div id="speedVal" class="text-lg sm:text-2xl font-black text-cyan-300 tracking-tight">0 <span class="text-xs text-slate-400">KM/H</span></div>
        </div>
      </div>
    </div>

    <!-- Center Prompt -->
    <div id="interactPrompt" class="self-center glass px-5 py-2.5 rounded-2xl border-cyan-400 text-xs sm:text-sm font-black text-white shadow-xl hidden">
      [E] ENTER VEHICLE
    </div>

    <!-- Mobile Touch Controls -->
    <div class="flex justify-between items-end pb-2 sm:hidden pointer-events-none">
      <div class="text-[10px] text-slate-400 font-bold pl-1">[DRAG TO MOVE / STEER]</div>
      <div class="flex gap-2.5 pointer-events-auto pr-1">
        <button id="btnAction" class="w-16 h-16 rounded-full glass border-2 border-cyan-400 flex flex-col items-center justify-center active:scale-95 text-xs text-white font-black shadow-lg">
          <span class="text-xl">🚗</span>
          <span id="btnActionLabel" class="text-[8px] tracking-wider">DRIVE</span>
        </button>
        <button id="btnSprint" class="w-14 h-14 rounded-full glass border border-amber-400 flex flex-col items-center justify-center active:scale-95 text-xs text-amber-300 font-bold">
          ⚡ SPRINT
        </button>
      </div>
    </div>
  </div>

  <div id="joyBase" class="joy-stick-base"><div id="joyThumb" class="joy-stick-thumb"></div></div>

  <script>
    // Audio Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(freq, type, dur, vol = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    // Three.js Scene Setup
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0c4e2);
    scene.fog = new THREE.FogExp2(0xa0c4e2, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x475569, 0.85);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff7ed, 1.4);
    sun.position.set(60, 110, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    // City Environment Setup
    const colliders = [];

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const walkMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 });
    function makeSidewalk(x, z, w, d) {
      const walk = new THREE.Mesh(new THREE.BoxGeometry(w, 0.25, d), walkMat);
      walk.position.set(x, 0.125, z);
      walk.receiveShadow = true;
      scene.add(walk);
    }
    makeSidewalk(-24, 0, 20, 260);
    makeSidewalk(24, 0, 20, 260);
    makeSidewalk(0, -24, 260, 20);
    makeSidewalk(0, 24, 260, 20);

    const yMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    for (let i = -120; i <= 120; i += 12) {
      const yL1 = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 6), yMat);
      yL1.rotation.x = -Math.PI / 2;
      yL1.position.set(0, 0.02, i);
      scene.add(yL1);

      const yL2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.35), yMat);
      yL2.rotation.x = -Math.PI / 2;
      yL2.position.set(i, 0.02, 0);
      scene.add(yL2);
    }

    function makeSkyscraper(x, z, w, d, h, baseColor) {
      const bldgGroup = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.4 })
      );
      body.position.y = h / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      bldgGroup.add(body);

      const winMat = new THREE.MeshStandardMaterial({ color: 0x93c5fd, roughness: 0.1, metalness: 0.8 });
      for (let y = 4; y < h - 4; y += 4.5) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 1.8, d + 0.1), winMat);
        win.position.y = y;
        bldgGroup.add(win);
      }
      bldgGroup.position.set(x, 0, z);
      scene.add(bldgGroup);
      colliders.push({ minX: x - w / 2 - 0.5, maxX: x + w / 2 + 0.5, minZ: z - d / 2 - 0.5, maxZ: z + d / 2 + 0.5 });
    }

    const cityLayout = [
      [-48, -48, 26, 26, 42, 0x1e293b],
      [-48, 48, 26, 26, 50, 0x0f172a],
      [48, -48, 26, 26, 36, 0x334155],
      [48, 48, 26, 26, 46, 0x0284c7],
      [-80, -48, 24, 24, 28, 0x475569],
      [80, 48, 24, 24, 40, 0x1e293b],
      [-48, -80, 24, 24, 35, 0x0f172a],
      [48, 80, 24, 24, 38, 0x334155]
    ];
    cityLayout.forEach(b => makeSkyscraper(...b));

    // Trees
    function makeTree(x, z) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 2.2), new THREE.MeshStandardMaterial({ color: 0x78350f }));
      trunk.position.set(x, 1.1, z);
      trunk.castShadow = true;
      const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(1.4), new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.8 }));
      leaves.position.set(x, 2.8, z);
      leaves.castShadow = true;
      scene.add(trunk);
      scene.add(leaves);
    }
    makeTree(12, 18);
    makeTree(12, -18);
    makeTree(-12, 18);
    makeTree(-12, -18);

    // Humanoid Character Rig
    const characterRig = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.6 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x18181b });
    const jacketMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });

    const hips = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.22, 0.3), pantsMat);
    hips.position.y = 0.95;
    characterRig.add(hips);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.62, 0.34), jacketMat);
    torso.position.y = 1.35;
    torso.castShadow = true;
    characterRig.add(torso);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.32, 0.32), skinMat);
    head.position.y = 1.9;
    head.castShadow = true;
    characterRig.add(head);

    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.33, 0.14, 0.35), hairMat);
    hair.position.set(0, 2.06, -0.02);
    characterRig.add(hair);

    const legLGroup = new THREE.Group();
    legLGroup.position.set(-0.16, 0.9, 0);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 0.2), pantsMat);
    legL.position.y = -0.42;
    const footL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.32), shoeMat);
    footL.position.set(0, -0.85, 0.06);
    legLGroup.add(legL); legLGroup.add(footL);
    characterRig.add(legLGroup);

    const legRGroup = new THREE.Group();
    legRGroup.position.set(0.16, 0.9, 0);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 0.2), pantsMat);
    legR.position.y = -0.42;
    const footR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.32), shoeMat);
    footR.position.set(0, -0.85, 0.06);
    legRGroup.add(legR); legRGroup.add(footR);
    characterRig.add(legRGroup);

    const armLGroup = new THREE.Group();
    armLGroup.position.set(-0.36, 1.6, 0);
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.72, 0.16), jacketMat);
    armL.position.y = -0.36;
    armLGroup.add(armL);
    characterRig.add(armLGroup);

    const armRGroup = new THREE.Group();
    armRGroup.position.set(0.36, 1.6, 0);
    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.72, 0.16), jacketMat);
    armR.position.y = -0.36;
    armRGroup.add(armR);
    characterRig.add(armRGroup);

    characterRig.position.set(0, 0, 8);
    scene.add(characterRig);

    const player = { x: 0, z: 8, speed: 0.14, sprintSpeed: 0.28, animCycle: 0 };
    let camYaw = 0, camPitch = 0.28;

    // Detailed 3D Car
    const carGroup = new THREE.Group();
    const carPaintMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.7, roughness: 0.25 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.8 });

    const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 4.6), carPaintMat);
    chassis.position.y = 0.5;
    carGroup.add(chassis);

    const nose = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.35, 1.2), carPaintMat);
    nose.position.set(0, 0.6, 1.8);
    carGroup.add(nose);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 2.2), glassMat);
    cabin.position.set(0, 1.05, -0.3);
    carGroup.add(cabin);

    const tireMat = new THREE.MeshStandardMaterial({ color: 0x18181b });
    const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 16);
    wheelGeo.rotateZ(Math.PI / 2);

    function createWheel() {
      const w = new THREE.Mesh(wheelGeo, tireMat);
      w.castShadow = true;
      const g = new THREE.Group();
      g.add(w);
      return g;
    }

    const wheelFL = createWheel(); wheelFL.position.set(-1.12, 0.42, 1.4);
    const wheelFR = createWheel(); wheelFR.position.set(1.12, 0.42, 1.4);
    const wheelBL = createWheel(); wheelBL.position.set(-1.12, 0.42, -1.4);
    const wheelBR = createWheel(); wheelBR.position.set(1.12, 0.42, -1.4);
    carGroup.add(wheelFL); carGroup.add(wheelFR); carGroup.add(wheelBL); carGroup.add(wheelBR);

    carGroup.position.set(5.5, 0, 4);
    scene.add(carGroup);

    const vehicle = { x: 5.5, z: 4, rotY: 0, speed: 0, steer: 0, maxSpeed: 0.75, accel: 0.018, friction: 0.97 };
    let inVehicle = false;

    // Mission Checkpoint
    const marker = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.RingGeometry(2.4, 3.0, 24), new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.05;
    marker.add(ring);

    const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 22), new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.45 }));
    beacon.position.y = 11;
    marker.add(beacon);
    marker.position.set(0, 0, -65);
    scene.add(marker);

    let playerCash = 2500;

    // Input Management
    const keys = {};
    let isMouseDown = false, prevMouseX = 0, prevMouseY = 0;
    let touchMove = { x: 0, y: 0 };
    let joyId = null, joyCenter = { x: 0, y: 0 };
    let camTouchId = null, prevTouchX = 0, prevTouchY = 0;
    let isSprinting = false;

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') toggleCarRide();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    window.addEventListener('mousedown', e => {
      if (e.button === 0 && e.clientX > 80) {
        isMouseDown = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      }
    });
    window.addEventListener('mousemove', e => {
      if (isMouseDown) {
        camYaw -= (e.clientX - prevMouseX) * 0.005;
        camPitch = Math.max(0.06, Math.min(0.82, camPitch + (e.clientY - prevMouseY) * 0.004));
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      }
    });
    window.addEventListener('mouseup', () => isMouseDown = false);

    const joyBase = document.getElementById('joyBase');
    const joyThumb = document.getElementById('joyThumb');

    window.addEventListener('touchstart', e => {
      for (let t of e.changedTouches) {
        if (t.clientX < window.innerWidth * 0.45 && joyId === null) {
          joyId = t.identifier;
          joyCenter = { x: t.clientX, y: t.clientY };
          joyBase.style.left = joyCenter.x + 'px';
          joyBase.style.top = joyCenter.y + 'px';
          joyThumb.style.left = '50%'; joyThumb.style.top = '50%';
          joyBase.style.display = 'block';
        } else if (t.clientX >= window.innerWidth * 0.45 && camTouchId === null) {
          camTouchId = t.identifier;
          prevTouchX = t.clientX;
          prevTouchY = t.clientY;
        }
      }
    });

    window.addEventListener('touchmove', e => {
      for (let t of e.changedTouches) {
        if (t.identifier === joyId) {
          let dx = t.clientX - joyCenter.x;
          let dy = t.clientY - joyCenter.y;
          let d = Math.hypot(dx, dy);
          if (d > 45) { dx = (dx / d) * 45; dy = (dy / d) * 45; }
          joyThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
          touchMove.x = dx / 45;
          touchMove.y = dy / 45;
        } else if (t.identifier === camTouchId) {
          let dx = t.clientX - prevTouchX;
          let dy = t.clientY - prevTouchY;
          camYaw -= dx * 0.006;
          camPitch = Math.max(0.06, Math.min(0.82, camPitch + dy * 0.005));
          prevTouchX = t.clientX;
          prevTouchY = t.clientY;
        }
      }
    });

    function endTouches(e) {
      for (let t of e.changedTouches) {
        if (t.identifier === joyId) {
          joyId = null;
          touchMove = { x: 0, y: 0 };
          joyBase.style.display = 'none';
        }
        if (t.identifier === camTouchId) camTouchId = null;
      }
    }
    window.addEventListener('touchend', endTouches);
    window.addEventListener('touchcancel', endTouches);

    document.getElementById('btnAction').addEventListener('touchstart', e => { e.preventDefault(); toggleCarRide(); });
    document.getElementById('btnSprint').addEventListener('touchstart', e => { e.preventDefault(); isSprinting = true; });
    document.getElementById('btnSprint').addEventListener('touchend', e => { e.preventDefault(); isSprinting = false; });

    function toggleCarRide() {
      if (inVehicle) {
        inVehicle = false;
        player.x = carGroup.position.x + 2.2;
        player.z = carGroup.position.z;
        characterRig.position.set(player.x, 0, player.z);
        characterRig.visible = true;

        document.getElementById('playerStateTag').innerText = 'ON FOOT';
        document.getElementById('playerStateTag').className = 'text-[11px] font-black uppercase tracking-wider text-cyan-300';
        document.getElementById('speedHud').classList.add('hidden');
        document.getElementById('btnActionLabel').innerText = 'DRIVE';
        playAudio(500, 'triangle', 0.1);
      } else {
        const dist = Math.hypot(player.x - carGroup.position.x, player.z - carGroup.position.z);
        if (dist < 4.5) {
          inVehicle = true;
          characterRig.visible = false;

          document.getElementById('playerStateTag').innerText = 'DRIVING GT COUPE';
          document.getElementById('playerStateTag').className = 'text-[11px] font-black uppercase tracking-wider text-amber-300';
          document.getElementById('speedHud').classList.remove('hidden');
          document.getElementById('btnActionLabel').innerText = 'EXIT';
          document.getElementById('interactPrompt').classList.add('hidden');
          playAudio(100, 'sawtooth', 0.25);
        }
      }
    }

    function checkCollision(x, z, radius = 0.5) {
      if (x < -125 || x > 125 || z < -125 || z > 125) return true;
      for (let c of colliders) {
        if (x + radius > c.minX && x - radius < c.maxX && z + radius > c.minZ && z - radius < c.maxZ) {
          return true;
        }
      }
      return false;
    }

    function resetPosition() {
      if (inVehicle) {
        carGroup.position.set(0, 0, 10);
        vehicle.speed = 0;
        vehicle.rotY = 0;
      } else {
        player.x = 0;
        player.z = 8;
        characterRig.position.set(0, 0, 8);
      }
    }

    // MAIN GAME ENGINE LOOP WITH CORRECTED VECTOR MATHEMATICS
    function updateEngine() {
      // Input Polling:
      // inX > 0: D / Right Arrow (Right)
      // inX < 0: A / Left Arrow (Left)
      // inY < 0: W / Up Arrow (Forward)
      // inY > 0: S / Down Arrow (Backward)
      let inX = touchMove.x;
      let inY = touchMove.y;

      if (inX === 0 && inY === 0) {
        if (keys['w'] || keys['arrowup']) inY -= 1;
        if (keys['s'] || keys['arrowdown']) inY += 1;
        if (keys['a'] || keys['arrowleft']) inX -= 1;
        if (keys['d'] || keys['arrowright']) inX += 1;

        if (inX !== 0 && inY !== 0) {
          inX *= 0.707106;
          inY *= 0.707106;
        }
      }

      // === 1. CAR DRIVING CONTROLS ===
      if (inVehicle) {
        const handbrake = keys[' '];

        // Acceleration (W) / Braking-Reverse (S)
        if (inY < -0.1) {
          vehicle.speed = Math.min(vehicle.maxSpeed, vehicle.speed + vehicle.accel);
        } else if (inY > 0.1) {
          vehicle.speed = Math.max(-0.25, vehicle.speed - vehicle.accel);
        } else {
          vehicle.speed *= vehicle.friction;
        }

        if (handbrake) vehicle.speed *= 0.88;

        // Steering: inX > 0 (D/Right) steers RIGHT. inX < 0 (A/Left) steers LEFT.
        const targetSteer = inX * 0.45;
        vehicle.steer = THREE.MathUtils.lerp(vehicle.steer, targetSteer, 0.18);

        // Visual front wheel rotation matches steering direction
        wheelFL.rotation.y = -vehicle.steer;
        wheelFR.rotation.y = -vehicle.steer;

        // Wheel Roll Rotation
        const rollDelta = vehicle.speed * 2.2;
        wheelFL.children[0].rotation.x += rollDelta;
        wheelFR.children[0].rotation.x += rollDelta;
        wheelBL.children[0].rotation.x += rollDelta;
        wheelBR.children[0].rotation.x += rollDelta;

        // Yaw Rotation:
        // When driving forward (speed > 0), steering right (positive steer) must rotate the car clockwise (decreasing rotY).
        if (Math.abs(vehicle.speed) > 0.01) {
          const forwardFactor = vehicle.speed >= 0 ? 1 : -1;
          vehicle.rotY -= vehicle.steer * (Math.abs(vehicle.speed) / vehicle.maxSpeed) * 0.07 * forwardFactor;
          carGroup.rotation.y = vehicle.rotY;
        }

        const nextX = carGroup.position.x + Math.sin(vehicle.rotY) * vehicle.speed;
        const nextZ = carGroup.position.z + Math.cos(vehicle.rotY) * vehicle.speed;

        if (!checkCollision(nextX, nextZ, 1.4)) {
          carGroup.position.x = nextX;
          carGroup.position.z = nextZ;
        } else {
          vehicle.speed = -vehicle.speed * 0.35;
          playAudio(70, 'square', 0.08);
        }

        const kmh = Math.round(Math.abs(vehicle.speed) * 165);
        document.getElementById('speedVal').innerHTML = `${kmh} <span class="text-xs text-slate-400">KM/H</span>`;

        // Third-person camera follow behind car
        const camDist = 7.0;
        camera.position.x = carGroup.position.x - Math.sin(vehicle.rotY) * camDist;
        camera.position.z = carGroup.position.z - Math.cos(vehicle.rotY) * camDist;
        camera.position.y = carGroup.position.y + 2.8;
        camera.lookAt(carGroup.position.x, carGroup.position.y + 1.2, carGroup.position.z);
      }

      // === 2. ON-FOOT WALKING CONTROLS ===
      else {
        const run = keys['shift'] || isSprinting;
        const curSpeed = run ? player.sprintSpeed : player.speed;
        const isMoving = (inX !== 0 || inY !== 0);

        if (isMoving) {
          // Accurate Horizontal Camera-Relative Vectors:
          // Camera position relative to player: (sin(yaw), cos(yaw))
          // Therefore, forward direction (from camera towards player) projected onto XZ is:
          const fwdX = -Math.sin(camYaw);
          const fwdZ = -Math.cos(camYaw);

          // Right direction (90 deg clockwise from Forward on XZ plane):
          // (fwdX, fwdZ) rotated -90 deg:
          const rightX = -fwdZ; // Math.cos(camYaw)
          const rightZ = fwdX;  // -Math.sin(camYaw)

          // W (inY < 0): +Forward
          // S (inY > 0): -Forward
          // D (inX > 0): +Right
          // A (inX < 0): -Right
          const moveX = (fwdX * (-inY)) + (rightX * inX);
          const moveZ = (fwdZ * (-inY)) + (rightZ * inX);

          const nextX = player.x + moveX * curSpeed;
          const nextZ = player.z + moveZ * curSpeed;

          if (!checkCollision(nextX, player.z, 0.4)) player.x = nextX;
          if (!checkCollision(player.x, nextZ, 0.4)) player.z = nextZ;

          characterRig.position.set(player.x, 0, player.z);

          // Turn character to face exactly along movement vector
          characterRig.rotation.y = Math.atan2(moveX, moveZ);

          // Limb animations
          player.animCycle += run ? 0.32 : 0.18;
          const legSwing = Math.sin(player.animCycle) * (run ? 0.85 : 0.55);
          const armSwing = Math.sin(player.animCycle) * (run ? 0.75 : 0.45);

          legLGroup.rotation.x = legSwing;
          legRGroup.rotation.x = -legSwing;
          armLGroup.rotation.x = -armSwing;
          armRGroup.rotation.x = armSwing;
          torso.position.y = 1.35 + Math.abs(Math.sin(player.animCycle)) * 0.05;
        } else {
          legLGroup.rotation.x = THREE.MathUtils.lerp(legLGroup.rotation.x, 0, 0.2);
          legRGroup.rotation.x = THREE.MathUtils.lerp(legRGroup.rotation.x, 0, 0.2);
          armLGroup.rotation.x = THREE.MathUtils.lerp(armLGroup.rotation.x, 0, 0.2);
          armRGroup.rotation.x = THREE.MathUtils.lerp(armRGroup.rotation.x, 0, 0.2);
          torso.position.y = 1.35;
        }

        // Camera Orbit around Character
        const camDist = 5.0;
        camera.position.x = player.x + Math.sin(camYaw) * camDist * Math.cos(camPitch);
        camera.position.z = player.z + Math.cos(camYaw) * camDist * Math.cos(camPitch);
        camera.position.y = 1.6 + Math.sin(camPitch) * camDist;
        camera.lookAt(player.x, 1.4, player.z);

        // Interaction Check with Car
        const distToCar = Math.hypot(player.x - carGroup.position.x, player.z - carGroup.position.z);
        const prompt = document.getElementById('interactPrompt');
        if (distToCar < 4.5) {
          prompt.classList.remove('hidden');
        } else {
          prompt.classList.add('hidden');
        }
      }

      // Checkpoint rotation & cash reward
      marker.rotation.y += 0.02;
      const activePos = inVehicle ? carGroup.position : characterRig.position;
      if (activePos.distanceTo(marker.position) < 4.8) {
        playerCash += 1500;
        document.getElementById('hudCash').innerText = `₹ ${playerCash.toLocaleString('en-IN')}`;
        playAudio(880, 'sine', 0.15, 0.15);

        const spots = [[-55, 0, 50], [45, 0, -45], [0, 0, 70], [-60, 0, -60]];
        const next = spots[Math.floor(Math.random() * spots.length)];
        marker.position.set(next[0], 0, next[2]);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(updateEngine);
    }

    // Viewport resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateEngine();
  </script>
</body>
</html>
