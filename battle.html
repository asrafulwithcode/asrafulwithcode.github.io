<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>REAL CITY - CORE PLAYABLE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; background: #38bdf8; font-family: monospace; }
    #canvas3d { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; z-index: 0; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); }
    .joy-stick-base { width: 100px; height: 100px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(56, 189, 248, 0.5); position: absolute; pointer-events: none; display: none; transform: translate(-50%, -50%); z-index: 30; }
    .joy-stick-thumb { width: 40px; height: 40px; border-radius: 50%; background: #38bdf8; position: absolute; transform: translate(-50%, -50%); left: 50%; top: 50%; box-shadow: 0 0 10px #0284c7; }
  </style>
</head>
<body class="relative">

  <canvas id="canvas3d"></canvas>

  <!-- MINIMAL CLEAN HUD -->
  <div id="hud" class="fixed inset-0 pointer-events-none flex flex-col justify-between p-3 sm:p-5 z-10 text-white">
    <!-- Top Info -->
    <div class="flex justify-between items-start gap-2">
      <div class="glass px-3.5 py-2 rounded-xl flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="modeTag" class="text-xs font-black text-cyan-300">ON FOOT</span>
      </div>

      <div class="flex flex-col items-end gap-1.5 pointer-events-auto">
        <button onclick="resetEntityPosition()" class="glass px-3 py-1.5 rounded-xl text-[11px] font-bold text-amber-300 active:scale-95">
          ↺ RESET POSITION
        </button>
        <div id="speedHud" class="glass px-3 py-1.5 rounded-xl text-right hidden">
          <div class="text-[9px] uppercase font-bold text-slate-400">Speed</div>
          <div id="speedVal" class="text-xl font-black text-cyan-300">0 KM/H</div>
        </div>
      </div>
    </div>

    <!-- Center Interaction Tooltip -->
    <div id="interactPrompt" class="self-center glass px-4 py-2 rounded-xl border-cyan-400 text-xs sm:text-sm font-black text-white shadow-lg hidden">
      [E] ENTER VEHICLE
    </div>

    <!-- Mobile Touch Action Buttons -->
    <div class="flex justify-between items-end pb-2 sm:hidden pointer-events-none">
      <div class="text-[9px] text-slate-800 font-bold bg-white/70 px-2 py-1 rounded">DRAG LEFT = MOVE | RIGHT = CAM</div>
      <div class="flex gap-2 pointer-events-auto">
        <button id="btnAction" class="w-16 h-16 rounded-full glass border-2 border-cyan-400 flex flex-col items-center justify-center active:scale-95 text-xs text-white font-black shadow-lg">
          <span class="text-lg">🚗</span>
          <span id="btnActionLabel" class="text-[8px]">ENTER</span>
        </button>
        <button id="btnSprint" class="w-14 h-14 rounded-full glass border border-amber-400 flex flex-col items-center justify-center active:scale-95 text-xs text-amber-300 font-bold">
          ⚡ SPRINT
        </button>
      </div>
    </div>
  </div>

  <!-- Touch Joystick -->
  <div id="joyBase" class="joy-stick-base"><div id="joyThumb" class="joy-stick-thumb"></div></div>

  <script>
    // --- 1. AUDIO SYNTH (Procedural feedback) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(freq, type, dur, vol = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    // --- 2. THREE.JS SCENE SETUP ---
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dd3fc); // Daylight Sky
    scene.fog = new THREE.FogExp2(0x7dd3fc, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.85);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfffbeb, 1.3);
    sun.position.set(50, 80, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    // --- 3. ENVIRONMENT & WORLD BOUNDARIES ---
    const colliders = [];

    // Ground plane
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Road Grid (Asphalt Crossways)
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
    const mainRoad = new THREE.Mesh(new THREE.PlaneGeometry(24, 300), roadMat);
    mainRoad.rotation.x = -Math.PI / 2;
    mainRoad.position.y = 0.02;
    scene.add(mainRoad);

    const crossRoad = new THREE.Mesh(new THREE.PlaneGeometry(300, 24), roadMat);
    crossRoad.rotation.x = -Math.PI / 2;
    crossRoad.position.y = 0.02;
    scene.add(crossRoad);

    // Road Markings
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    for (let i = -140; i <= 140; i += 12) {
      const line1 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 6), lineMat);
      line1.rotation.x = -Math.PI / 2;
      line1.position.set(0, 0.03, i);
      scene.add(line1);

      const line2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.5), lineMat);
      line2.rotation.x = -Math.PI / 2;
      line2.position.set(i, 0.03, 0);
      scene.add(line2);
    }

    // Skyscrapers with Static Box Colliders
    const bldgColors = [0x334155, 0x1e293b, 0x0f172a, 0x0284c7, 0x475569];
    for (let x = -100; x <= 100; x += 45) {
      for (let z = -100; z <= 100; z += 45) {
        if (Math.abs(x) < 25 || Math.abs(z) < 25) continue; // Keep roads clear
        const h = 18 + Math.random() * 32;
        const bldg = new THREE.Mesh(
          new THREE.BoxGeometry(26, h, 26),
          new THREE.MeshStandardMaterial({ color: bldgColors[Math.floor(Math.random() * bldgColors.length)], roughness: 0.3 })
        );
        bldg.position.set(x, h / 2, z);
        bldg.castShadow = true;
        bldg.receiveShadow = true;
        scene.add(bldg);

        // Store bounding box for collision detection
        colliders.push({ minX: x - 13.5, maxX: x + 13.5, minZ: z - 13.5, maxZ: z + 13.5 });
      }
    }

    // --- 4. PLAYER & THIRD-PERSON RIG ---
    const playerGroup = new THREE.Group();

    // Body
    const pBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.35, 1.3, 8),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.5 })
    );
    pBody.position.y = 0.65;
    pBody.castShadow = true;
    playerGroup.add(pBody);

    // Head
    const pHead = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xfde047 })
    );
    pHead.position.y = 1.48;
    pHead.castShadow = true;
    playerGroup.add(pHead);

    playerGroup.position.set(0, 0, 10);
    scene.add(playerGroup);

    const player = {
      x: 0, z: 10,
      vx: 0, vz: 0,
      rotY: 0,
      speed: 0.14,
      sprintSpeed: 0.26
    };

    let camYaw = 0, camPitch = 0.3;

    // --- 5. VEHICLE SYSTEM (PHYSICS MODEL) ---
    const carGroup = new THREE.Group();

    // Chassis
    const carBody = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 0.85, 4.4),
      new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.4, roughness: 0.3 })
    );
    carBody.position.y = 0.65;
    carBody.castShadow = true;
    carGroup.add(carBody);

    // Cabin Glass
    const carCabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.65, 2.2),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 })
    );
    carCabin.position.set(0, 1.25, -0.2);
    carGroup.add(carCabin);

    // Front Wheels (pivot for steering)
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
    const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 8);
    wheelGeo.rotateZ(Math.PI / 2);

    const fWheelL = new THREE.Mesh(wheelGeo, wheelMat);
    fWheelL.position.set(-1.05, 0.38, 1.3);
    const fWheelR = new THREE.Mesh(wheelGeo, wheelMat);
    fWheelR.position.set(1.05, 0.38, 1.3);
    const bWheelL = new THREE.Mesh(wheelGeo, wheelMat);
    bWheelL.position.set(-1.05, 0.38, -1.3);
    const bWheelR = new THREE.Mesh(wheelGeo, wheelMat);
    bWheelR.position.set(1.05, 0.38, -1.3);

    carGroup.add(fWheelL);
    carGroup.add(fWheelR);
    carGroup.add(bWheelL);
    carGroup.add(bWheelR);

    // Headlights
    const headLightL = new THREE.SpotLight(0xffffff, 2.5, 30, Math.PI / 6, 0.3);
    headLightL.position.set(0.7, 0.7, 2.2);
    headLightL.target.position.set(0.7, 0, 15);
    carGroup.add(headLightL);
    carGroup.add(headLightL.target);

    const headLightR = new THREE.SpotLight(0xffffff, 2.5, 30, Math.PI / 6, 0.3);
    headLightR.position.set(-0.7, 0.7, 2.2);
    headLightR.target.position.set(-0.7, 0, 15);
    carGroup.add(headLightR);
    carGroup.add(headLightR.target);

    carGroup.position.set(5, 0, 6);
    scene.add(carGroup);

    const car = {
      group: carGroup,
      x: 5, z: 6,
      rotY: 0,
      speed: 0,
      steerAngle: 0,
      accel: 0.014,
      maxSpeed: 0.7,
      maxReverse: -0.25,
      friction: 0.975,
      steerSpeed: 0.04
    };

    let inVehicle = false;

    // --- 6. INPUT ENGINE (KEYBOARD & TOUCH) ---
    const keys = {};
    let isMouseDown = false, prevMouseX = 0, prevMouseY = 0;
    let touchMove = { x: 0, y: 0 };
    let joyId = null, joyCenter = { x: 0, y: 0 };
    let camTouchId = null, prevTouchX = 0, prevTouchY = 0;
    let touchSprint = false;

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') toggleVehicle();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Mouse camera controls
    window.addEventListener('mousedown', e => {
      if (e.button === 0 && e.clientX > 100) {
        isMouseDown = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      }
    });
    window.addEventListener('mousemove', e => {
      if (isMouseDown) {
        camYaw -= (e.clientX - prevMouseX) * 0.005;
        camPitch = Math.max(0.08, Math.min(0.85, camPitch + (e.clientY - prevMouseY) * 0.004));
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      }
    });
    window.addEventListener('mouseup', () => isMouseDown = false);

    // Mobile Virtual Joystick & Touch Look
    const joyBase = document.getElementById('joyBase');
    const joyThumb = document.getElementById('joyThumb');

    window.addEventListener('touchstart', e => {
      for (let t of e.changedTouches) {
        if (t.clientX < window.innerWidth * 0.45 && joyId === null) {
          joyId = t.identifier;
          joyCenter = { x: t.clientX, y: t.clientY };
          joyBase.style.left = joyCenter.x + 'px';
          joyBase.style.top = joyCenter.y + 'px';
          joyThumb.style.left = '50%';
          joyThumb.style.top = '50%';
          joyBase.style.display = 'block';
        } else if (t.clientX >= window.innerWidth * 0.45 && camTouchId === null) {
          camTouchId = t.identifier;
          prevTouchX = t.clientX;
          prevTouchY = t.clientY;
        }
      }
    });

    window.addEventListener('touchmove', e => {
      for (let t of e.changedTouches) {
        if (t.identifier === joyId) {
          let dx = t.clientX - joyCenter.x;
          let dy = t.clientY - joyCenter.y;
          let d = Math.hypot(dx, dy);
          if (d > 45) { dx = (dx / d) * 45; dy = (dy / d) * 45; }
          joyThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
          touchMove.x = dx / 45;
          touchMove.y = dy / 45;
        } else if (t.identifier === camTouchId) {
          let dx = t.clientX - prevTouchX;
          let dy = t.clientY - prevTouchY;
          camYaw -= dx * 0.006;
          camPitch = Math.max(0.08, Math.min(0.85, camPitch + dy * 0.005));
          prevTouchX = t.clientX;
          prevTouchY = t.clientY;
        }
      }
    });

    function touchEnd(e) {
      for (let t of e.changedTouches) {
        if (t.identifier === joyId) {
          joyId = null;
          touchMove = { x: 0, y: 0 };
          joyBase.style.display = 'none';
        }
        if (t.identifier === camTouchId) camTouchId = null;
      }
    }
    window.addEventListener('touchend', touchEnd);
    window.addEventListener('touchcancel', touchEnd);

    // Mobile Action Button
    document.getElementById('btnAction').addEventListener('touchstart', e => {
      e.preventDefault();
      toggleVehicle();
    });
    document.getElementById('btnSprint').addEventListener('touchstart', e => {
      e.preventDefault();
      touchSprint = true;
    });
    document.getElementById('btnSprint').addEventListener('touchend', e => {
      e.preventDefault();
      touchSprint = false;
    });

    function toggleVehicle() {
      if (inVehicle) {
        // Exit
        inVehicle = false;
        player.x = car.group.position.x + 2.0;
        player.z = car.group.position.z;
        playerGroup.position.set(player.x, 0, player.z);
        playerGroup.visible = true;

        document.getElementById('modeTag').innerText = "ON FOOT";
        document.getElementById('modeTag').className = "text-xs font-black text-cyan-300";
        document.getElementById('speedHud').classList.add('hidden');
        document.getElementById('btnActionLabel').innerText = "ENTER";
        playAudio(440, 'triangle', 0.1);
      } else {
        // Check Distance to Car
        const dist = Math.hypot(player.x - car.group.position.x, player.z - car.group.position.z);
        if (dist < 4.2) {
          inVehicle = true;
          playerGroup.visible = false;

          document.getElementById('modeTag').innerText = "DRIVING GT COUPE";
          document.getElementById('modeTag').className = "text-xs font-black text-amber-300";
          document.getElementById('speedHud').classList.remove('hidden');
          document.getElementById('btnActionLabel').innerText = "EXIT";
          document.getElementById('interactPrompt').classList.add('hidden');
          playAudio(120, 'sawtooth', 0.25);
        }
      }
    }

    function checkCollision(x, z, radius = 0.6) {
      // Bounds
      if (x < -140 || x > 140 || z < -140 || z > 140) return true;
      // Building Colliders
      for (let c of colliders) {
        if (x + radius > c.minX && x - radius < c.maxX && z + radius > c.minZ && z - radius < c.maxZ) {
          return true;
        }
      }
      return false;
    }

    function resetEntityPosition() {
      if (inVehicle) {
        car.group.position.set(0, 0, 10);
        car.speed = 0;
        car.rotY = 0;
      } else {
        player.x = 0;
        player.z = 10;
        playerGroup.position.set(0, 0, 10);
      }
    }

    // --- 7. MAIN ENGINE LOOP ---
    function update() {
      let mx = touchMove.x;
      let my = touchMove.y;

      if (mx === 0 && my === 0) {
        if (keys['w'] || keys['arrowup']) my -= 1;
        if (keys['s'] || keys['arrowdown']) my += 1;
        if (keys['a'] || keys['arrowleft']) mx -= 1;
        if (keys['d'] || keys['arrowright']) mx += 1;
        if (mx !== 0 && my !== 0) { mx *= 0.7071; my *= 0.7071; }
      }

      // === DRIVING LOGIC ===
      if (inVehicle) {
        // Handbrake
        const handbrake = keys[' '];

        // Acceleration / Reverse
        if (my < -0.1) {
          car.speed = Math.min(car.maxSpeed, car.speed + car.accel);
        } else if (my > 0.1) {
          car.speed = Math.max(car.maxReverse, car.speed - car.accel);
        } else {
          car.speed *= car.friction;
        }

        if (handbrake) {
          car.speed *= 0.88;
        }

        // Steering Physics
        if (Math.abs(mx) > 0.05) {
          car.steerAngle = THREE.MathUtils.lerp(car.steerAngle, -mx * 0.5, 0.15);
        } else {
          car.steerAngle = THREE.MathUtils.lerp(car.steerAngle, 0, 0.2);
        }

        fWheelL.rotation.y = car.steerAngle;
        fWheelR.rotation.y = car.steerAngle;

        // Apply turning with forward momentum
        if (Math.abs(car.speed) > 0.01) {
          car.rotY += car.steerAngle * (car.speed / car.maxSpeed) * 0.08;
          car.group.rotation.y = car.rotY;
        }

        // Test next position with collision
        const nextX = car.group.position.x + Math.sin(car.rotY) * car.speed;
        const nextZ = car.group.position.z + Math.cos(car.rotY) * car.speed;

        if (!checkCollision(nextX, nextZ, 1.3)) {
          car.group.position.x = nextX;
          car.group.position.z = nextZ;
        } else {
          car.speed = -car.speed * 0.3; // Rebound bounce
          playAudio(80, 'square', 0.1);
        }

        // Speedometer UI
        const kmh = Math.round(Math.abs(car.speed) * 160);
        document.getElementById('speedVal').innerText = `${kmh} KM/H`;

        // Chase Camera Follows Car
        const camDist = 6.8;
        camera.position.x = car.group.position.x - Math.sin(car.rotY) * camDist;
        camera.position.z = car.group.position.z - Math.cos(car.rotY) * camDist;
        camera.position.y = car.group.position.y + 2.8;
        camera.lookAt(car.group.position.x, car.group.position.y + 1.1, car.group.position.z);
      }

      // === ON FOOT LOGIC ===
      else {
        const isSprint = keys['shift'] || touchSprint;
        const currentSpeed = isSprint ? player.sprintSpeed : player.speed;

        if (mx !== 0 || my !== 0) {
          // Camera-relative forward & right vectors
          const fwdX = -Math.sin(camYaw);
          const fwdZ = -Math.cos(camYaw);
          const sideX = -Math.cos(camYaw);
          const sideZ = Math.sin(camYaw);

          const moveX = (fwdX * -my) + (sideX * mx);
          const moveZ = (fwdZ * -my) + (sideZ * mx);

          const nextX = player.x + moveX * currentSpeed;
          const nextZ = player.z + moveZ * currentSpeed;

          if (!checkCollision(nextX, player.z, 0.45)) player.x = nextX;
          if (!checkCollision(player.x, nextZ, 0.45)) player.z = nextZ;

          playerGroup.position.set(player.x, 0, player.z);
          playerGroup.rotation.y = Math.atan2(moveX, moveZ);
        }

        // Orbit Camera Position
        const camDist = 4.8;
        camera.position.x = player.x + Math.sin(camYaw) * camDist * Math.cos(camPitch);
        camera.position.z = player.z + Math.cos(camYaw) * camDist * Math.cos(camPitch);
        camera.position.y = 1.35 + Math.sin(camPitch) * camDist;
        camera.lookAt(player.x, 1.25, player.z);

        // Interaction Check with Car
        const distToCar = Math.hypot(player.x - car.group.position.x, player.z - car.group.position.z);
        const prompt = document.getElementById('interactPrompt');
        if (distToCar < 4.2) {
          prompt.classList.remove('hidden');
        } else {
          prompt.classList.add('hidden');
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(update);
    }

    // Responsive Viewport Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    update();
  </script>
</body>
</html>
