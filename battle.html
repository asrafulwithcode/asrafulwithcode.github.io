<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CYBER WARP 3D - FinGrowTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Library for Real 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #030712; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body class="font-sans text-white">

  <!-- UI Overlay -->
  <div id="hud" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
    <div class="flex justify-between items-center">
      <a href="/" class="pointer-events-auto bg-slate-900/80 backdrop-blur border border-cyan-500/30 px-4 py-2 rounded-xl text-cyan-400 text-sm font-bold hover:bg-cyan-500/20 transition">
        ← Home
      </a>
      <div class="text-right">
        <div class="text-xs uppercase tracking-widest text-cyan-400 font-bold">Score</div>
        <div id="scoreVal" class="text-3xl font-black tracking-wider text-white">0</div>
      </div>
    </div>

    <!-- Mobile Touch Area Notification -->
    <div class="text-center text-xs text-slate-500 sm:hidden">
      Tap Left / Right Screen to Steer
    </div>
  </div>

  <!-- Start & Game Over Screen -->
  <div id="overlay" class="absolute inset-0 flex items-center justify-center bg-black/85 backdrop-blur-md z-20">
    <div class="max-w-md w-full mx-4 p-8 bg-slate-900 border border-cyan-500/40 rounded-3xl text-center shadow-2xl shadow-cyan-500/20">
      <div class="inline-block p-3 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 text-cyan-400 text-xs font-bold uppercase tracking-widest mb-3">
        3D Sci-Fi Reflex Tunnel
      </div>
      <h1 id="titleText" class="text-4xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-2">
        CYBER WARP
      </h1>
      <p id="subText" class="text-slate-400 text-sm mb-6">
        Dodge the red laser barriers at warp speed. Use <strong class="text-cyan-300">A / D</strong> or <strong class="text-cyan-300">Arrow Keys</strong> or Touch sides.
      </p>

      <div id="scoreCard" class="hidden mb-6 bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <div class="text-xs text-slate-400">Survival Distance</div>
        <div id="finalScore" class="text-3xl font-extrabold text-cyan-400">0 m</div>
      </div>

      <button id="startBtn" onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-cyan-500/30 transition transform active:scale-95">
        START HYPERDRIVE
      </button>
    </div>
  </div>

  <script>
    // Audio Synthesizer (No external sound files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundCrash() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const node = audioCtx.createBufferSource();
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
      node.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      node.connect(gain);
      gain.connect(audioCtx.destination);
      node.start();
    }

    // 3D Scene Initialization
    let scene, camera, renderer, ship, obstacles = [], stars;
    let isPlaying = false;
    let score = 0;
    let speed = 1.6;
    let targetX = 0;
    const laneLimit = 5.2;

    function init3D() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030712, 0.018);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 7);
      camera.rotation.x = -0.25;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Ambient & Directional Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00e5ff, 1.2);
      dirLight.position.set(0, 10, 5);
      scene.add(dirLight);

      // Player Ship (3D Futuristic Cone / Pyramid)
      const shipGeo = new THREE.ConeGeometry(0.7, 2, 4);
      const shipMat = new THREE.MeshStandardMaterial({
        color: 0x00e5ff,
        emissive: 0x0077ff,
        roughness: 0.2,
        metalness: 0.8
      });
      ship = new THREE.Mesh(shipGeo, shipMat);
      ship.rotation.x = Math.PI / 2;
      ship.position.set(0, 0.5, 0);
      scene.add(ship);

      // 3D Grid Track
      const grid = new THREE.GridHelper(120, 60, 0x00f0ff, 0x1e1b4b);
      grid.position.set(0, -0.2, -40);
      scene.add(grid);

      // Starfield Particles
      const starGeo = new THREE.BufferGeometry();
      const starCount = 600;
      const starCoords = [];
      for (let i = 0; i < starCount; i++) {
        starCoords.push(
          (Math.random() - 0.5) * 60,
          (Math.random() - 0.5) * 40,
          (Math.random() - 0.5) * 150
        );
      }
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.25 });
      stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      animate();
    }

    // Spawn Obstacle Blocks
    function spawnObstacle() {
      const width = 1.8 + Math.random() * 1.5;
      const geo = new THREE.BoxGeometry(width, 1.4, 0.8);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff0055,
        emissive: 0xaa0033,
        roughness: 0.3
      });
      const obs = new THREE.Mesh(geo, mat);
      obs.position.x = (Math.random() - 0.5) * (laneLimit * 2);
      obs.position.y = 0.7;
      obs.position.z = -90;
      scene.add(obs);
      obstacles.push(obs);
    }

    // Game Loop
    let spawnTimer = 0;
    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying) {
        // Player smooth lerping & bank tilt
        ship.position.x += (targetX - ship.position.x) * 0.18;
        ship.rotation.z = (ship.position.x - targetX) * 0.4;

        // Move stars backward
        stars.position.z += speed * 0.5;
        if (stars.position.z > 50) stars.position.z = 0;

        // Spawn obstacles
        spawnTimer++;
        if (spawnTimer > 32) {
          spawnObstacle();
          spawnTimer = 0;
        }

        // Update obstacles & check collisions
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += speed;

          // AABB Hitbox detection
          if (
            Math.abs(obs.position.z - ship.position.z) < 1.1 &&
            Math.abs(obs.position.x - ship.position.x) < (obs.geometry.parameters.width / 2 + 0.4)
          ) {
            gameOver();
            return;
          }

          // Remove passed obstacles
          if (obs.position.z > 12) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            score += 10;
            document.getElementById('scoreVal').innerText = score;
            playBeep(440 + (score % 400), 'triangle', 0.05);

            // Progressive difficulty speed increase
            if (speed < 3.2) speed += 0.015;
          }
        }
      }

      renderer.render(scene, camera);
    }

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');
      // Reset State
      obstacles.forEach(o => scene.remove(o));
      obstacles = [];
      score = 0;
      speed = 1.6;
      targetX = 0;
      ship.position.x = 0;
      document.getElementById('scoreVal').innerText = '0';
      isPlaying = true;
      playBeep(520, 'sine', 0.15);
    }

    function gameOver() {
      isPlaying = false;
      soundCrash();
      document.getElementById('titleText').innerText = 'SHIP DESTROYED';
      document.getElementById('subText').innerText = 'System crashed into laser wall barrier.';
      document.getElementById('scoreCard').classList.remove('hidden');
      document.getElementById('finalScore').innerText = score + ' m';
      document.getElementById('startBtn').innerText = 'RESTART SYSTEM';
      document.getElementById('overlay').classList.remove('hidden');
    }

    // Controls: Keyboard
    window.addEventListener('keydown', (e) => {
      if (!isPlaying) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        targetX = Math.max(-laneLimit, targetX - 2.2);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        targetX = Math.min(laneLimit, targetX + 2.2);
      }
    });

    // Controls: Touch / Mobile
    window.addEventListener('touchstart', (e) => {
      if (!isPlaying) return;
      const touchX = e.touches[0].clientX;
      if (touchX < window.innerWidth / 2) {
        targetX = Math.max(-laneLimit, targetX - 2.2);
      } else {
        targetX = Math.min(laneLimit, targetX + 2.2);
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init3D();
  </script>
</body>
</html>
