<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NEON WAVE: CYBER DRIFT - FinGrowTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7999276757460411" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #05050d; touch-action: none; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body class="select-none bg-slate-950 text-white">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 w-full bg-slate-950/70 backdrop-blur-md border-b border-slate-800/80 z-30 pointer-events-auto">
    <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between">
      <a href="/" class="text-lg font-black tracking-tight text-cyan-400">FinGrow<span class="text-white">Tools</span></a>
      <nav class="flex items-center space-x-3 text-xs font-bold text-slate-300">
        <a href="/" class="hover:text-cyan-400">Tools</a>
        <a href="/battle.html" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-500/40">Neon Wave</a>
      </nav>
    </div>
  </header>

  <!-- HUD -->
  <div class="fixed top-14 left-0 w-full px-4 sm:px-6 flex justify-between items-center z-10 pointer-events-none">
    <div class="flex items-center space-x-3">
      <div class="bg-slate-900/80 backdrop-blur border border-cyan-500/40 px-3.5 py-1.5 rounded-xl shadow-lg">
        <span class="text-[9px] text-cyan-400 font-black tracking-widest block">SCORE</span>
        <span id="uiScore" class="text-xl sm:text-2xl font-black text-cyan-300">0</span>
      </div>
      <div class="bg-slate-900/80 backdrop-blur border border-amber-500/50 px-3.5 py-1.5 rounded-xl shadow-lg">
        <span class="text-[9px] text-amber-400 font-black tracking-widest block">BEST</span>
        <span id="uiBest" class="text-xl sm:text-2xl font-black text-amber-300">0</span>
      </div>
    </div>
    <div id="comboBadge" class="hidden bg-pink-500/20 border border-pink-500 px-3 py-1 rounded-xl text-pink-400 font-black text-xs animate-pulse">
      NEAR MISS x2!
    </div>
  </div>

  <!-- Start / Game Over Screen -->
  <div id="overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 text-center">
    <div class="inline-block px-3 py-1 bg-cyan-500/10 border border-cyan-500/30 rounded-full text-cyan-400 text-xs font-bold tracking-widest mb-3 uppercase">
      Addictive Cyber Drift
    </div>
    <h1 id="overTitle" class="text-5xl sm:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-amber-400 mb-2">
      NEON WAVE
    </h1>
    <p id="overDesc" class="text-slate-400 text-xs sm:text-sm max-w-sm mb-8 leading-relaxed">
      <b>HOLD SCREEN / SPACEBAR</b> to drift up ↗<br/>
      <b>RELEASE</b> to dive down ↘<br/>
      Dodge lasers, scrape close for bonus multiplier!
    </p>
    <button id="btnAction" class="px-8 py-3.5 bg-gradient-to-r from-cyan-400 via-pink-500 to-amber-400 text-slate-950 font-black text-base sm:text-lg rounded-2xl shadow-xl shadow-cyan-500/25 active:scale-95 transition cursor-pointer pointer-events-auto">
      TAP TO DRIFT
    </button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration, vol=0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let isHolding = false;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('neon_best') || '0');
    document.getElementById('uiBest').innerText = bestScore;

    let player = { x: 120, y: 0, vy: 0, r: 12 };
    let trail = [];
    let obstacles = [];
    let speed = 5.5;
    let hue = 180;
    let screenShake = 0;

    function setHold(state) {
      if (!isPlaying) return;
      if (state && !isHolding) playBeep(520, 'sine', 0.08, 0.08);
      isHolding = state;
    }

    // Touch & Mouse Controls for Playing State
    window.addEventListener('touchstart', (e) => {
      if (!isPlaying) return;
      e.preventDefault();
      setHold(true);
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (!isPlaying) return;
      e.preventDefault();
      setHold(false);
    }, { passive: false });

    window.addEventListener('mousedown', () => setHold(true));
    window.addEventListener('mouseup', () => setHold(false));
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') setHold(true); });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space') setHold(false); });

    // Explicit Start Trigger for Mobile & Desktop
    const btnAction = document.getElementById('btnAction');
    btnAction.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });
    btnAction.addEventListener('touchend', (e) => {
      e.stopPropagation();
      startGame();
    });

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      player.x = Math.min(180, canvas.width * 0.2);
      player.y = canvas.height / 2;
      player.vy = 0;
      trail = [];
      obstacles = [];
      score = 0;
      speed = 6;
      isPlaying = true;
      isHolding = false;
      document.getElementById('uiScore').innerText = '0';
      document.getElementById('overlay').classList.add('hidden');
      playBeep(440, 'triangle', 0.2, 0.15);

      for (let i = 0; i < 4; i++) {
        spawnObstacle(canvas.width + 300 + i * 320);
      }
    }

    function spawnObstacle(xPos) {
      const minGap = 160;
      const gap = Math.max(120, minGap - Math.min(score * 0.4, 45));
      const topHeight = Math.random() * (canvas.height - gap - 160) + 80;
      obstacles.push({
        x: xPos,
        top: topHeight,
        bottom: topHeight + gap,
        width: 32,
        passed: false
      });
    }

    function gameOver() {
      isPlaying = false;
      isHolding = false;
      playBeep(120, 'sawtooth', 0.4, 0.25);
      screenShake = 18;

      if (score > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('neon_best', bestScore);
        document.getElementById('uiBest').innerText = bestScore;
      }

      document.getElementById('overTitle').innerText = "WAVE CRASHED";
      document.getElementById('overDesc').innerHTML = `Final Score: <b class="text-cyan-300 text-lg">${Math.floor(score)}</b><br/>High Score: <b class="text-amber-400">${bestScore}</b>`;
      document.getElementById('btnAction').innerText = "RETRY DRIFT";
      document.getElementById('overlay').classList.remove('hidden');
    }

    function loop() {
      requestAnimationFrame(loop);

      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.88;
      }

      ctx.fillStyle = '#05050d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      if (isPlaying) {
        const targetVy = isHolding ? -speed * 1.05 : speed * 1.05;
        player.vy += (targetVy - player.vy) * 0.2;
        player.y += player.vy;
        score += 0.25;
        speed = Math.min(11, 6 + score * 0.004);
        hue = (hue + 0.4) % 360;

        document.getElementById('uiScore').innerText = Math.floor(score);

        if (player.y - player.r < 0 || player.y + player.r > canvas.height) {
          gameOver();
        }

        trail.push({ x: player.x, y: player.y, hue: hue });
        if (trail.length > 35) trail.shift();

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= speed;

          if (!obs.passed && obs.x < player.x) {
            obs.passed = true;
            playBeep(880, 'sine', 0.05, 0.05);
            const distToTop = Math.abs(player.y - obs.top);
            const distToBottom = Math.abs(player.y - obs.bottom);
            if (distToTop < 30 || distToBottom < 30) {
              score += 15;
              screenShake = 6;
              const badge = document.getElementById('comboBadge');
              badge.classList.remove('hidden');
              setTimeout(() => badge.classList.add('hidden'), 600);
            }
          }

          if (player.x + player.r > obs.x && player.x - player.r < obs.x + obs.width) {
            if (player.y - player.r < obs.top || player.y + player.r > obs.bottom) {
              gameOver();
            }
          }

          if (obs.x + obs.width < -50) {
            obstacles.splice(i, 1);
            const lastObsX = obstacles[obstacles.length - 1].x;
            spawnObstacle(lastObsX + 280 + Math.random() * 80);
          }
        }
      }

      for (const obs of obstacles) {
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 12;
        ctx.fillRect(obs.x, 0, obs.width, obs.top);
        ctx.fillRect(obs.x, obs.bottom, obs.width, canvas.height - obs.bottom);
        ctx.shadowBlur = 0;
      }

      if (trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) {
          ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      const angle = Math.atan2(player.vy, speed);
      ctx.rotate(angle);

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = `hsl(${hue}, 100%, 65%)`;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(-10, -8);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    loop();
  </script>
</body>
</html>
