<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CyberShift 3D: Hyper Velocity - FinGrowTools</title>
  <meta name="description" content="Smooth 3D tunnel runner game with dynamic throttle & brake mechanics right in your browser." />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7999276757460411" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #020617; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body class="select-none font-sans text-white bg-slate-950">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 w-full bg-slate-950/80 backdrop-blur-md border-b border-slate-800 z-30">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <a href="/" class="text-xl font-black tracking-tight text-cyan-400">FinGrow<span class="text-white">Tools</span></a>
      <nav class="flex items-center space-x-2 sm:space-x-4 text-xs font-semibold text-slate-300">
        <a href="/" class="hover:text-cyan-400 transition">Calculators</a>
        <a href="/compressor.html" class="hover:text-cyan-400 transition">Compressor</a>
        <a href="/age-calculator.html" class="hover:text-cyan-400 transition">Age Tool</a>
        <a href="/battle.html" class="bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-lg border border-cyan-500/40">CyberShift 3D</a>
      </nav>
    </div>
  </header>

  <!-- HUD Overlay -->
  <div class="fixed top-14 left-0 w-full px-4 sm:px-6 flex justify-between items-center z-10 pointer-events-none">
    <div class="flex items-center space-x-2 sm:space-x-3">
      <div class="bg-slate-900/80 backdrop-blur border border-cyan-500/40 px-3.5 py-1.5 rounded-xl shadow-lg">
        <span class="text-[10px] text-cyan-400 font-bold tracking-widest block">SCORE</span>
        <span class="text-xl sm:text-2xl font-black tracking-wider" id="scoreDisplay">00000</span>
      </div>
      <div class="bg-slate-900/80 backdrop-blur border border-amber-500/50 px-3.5 py-1.5 rounded-xl shadow-lg">
        <span class="text-[10px] text-amber-400 font-bold tracking-widest block">🪙 COINS</span>
        <span class="text-xl sm:text-2xl font-black text-amber-300 tracking-wider" id="coinDisplay">0</span>
      </div>
    </div>
    
    <div class="flex flex-col items-end space-y-1">
      <div class="bg-slate-900/80 backdrop-blur border border-pink-500/40 px-3.5 py-1.5 rounded-xl text-right shadow-lg">
        <span class="text-[10px] text-pink-400 font-bold tracking-widest block" id="modeStatus">SLOW CRUISE</span>
        <span class="text-lg sm:text-xl font-black text-pink-300" id="speedDisplay">40 KM/H</span>
      </div>
      <!-- Throttle Bar -->
      <div class="w-28 bg-slate-900/80 border border-slate-700 h-1.5 rounded-full overflow-hidden">
        <div id="throttleBar" class="bg-gradient-to-r from-cyan-400 to-pink-500 h-full w-0 transition-all duration-150"></div>
      </div>
    </div>
  </div>

  <!-- Start & Game Over Screen -->
  <div id="gameOverlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 text-center">
    <div class="inline-block px-3 py-1 bg-cyan-500/10 border border-cyan-500/30 rounded-full text-cyan-400 text-xs font-bold tracking-widest mb-3 uppercase">
      Dynamic Throttle Runner
    </div>
    <h1 id="mainTitle" class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-amber-400 mb-2">
      CYBERSHIFT 3D
    </h1>
    <p id="subTitle" class="text-slate-400 text-xs sm:text-sm max-w-md mb-8 leading-relaxed">
      <b>PRO MECHANIC:</b> Hold touch or press keys to <b>THRUST FAST</b>. Release controls anytime to <b>SLOW DOWN</b> and dodge tight barriers easily!
    </p>
    <button onclick="startGame()" id="btnPlay" class="px-8 py-3.5 bg-gradient-to-r from-amber-500 via-cyan-500 to-blue-600 hover:brightness-110 text-slate-950 font-black text-base sm:text-lg rounded-2xl shadow-xl shadow-cyan-500/30 active:scale-95 transition">
      LAUNCH MISSION
    </button>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'start') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'crash') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    let scene, camera, renderer, ship, stars;
    let obstacles = [];
    let coins = [];
    
    // Speed control parameters
    const cruiseSpeed = 0.35; // Jab chhod dega toh yeh slow speed rahegi
    const maxBoostSpeed = 0.95; // Jab control karega toh fast chalega
    let currentSpeed = cruiseSpeed;
    let isActivelyControlling = false;
    let controlTimeout = null;

    let score = 0;
    let coinsCollected = 0;
    let isPlaying = false;
    let targetShipX = 0;
    const boundaryX = 13;

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.015);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3.2, 7.5);
      camera.rotation.x = -0.22;

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
      dirLight.position.set(5, 12, 8);
      scene.add(dirLight);

      // 3D Ship
      const shipGeo = new THREE.ConeGeometry(0.75, 2.2, 5);
      const shipMat = new THREE.MeshStandardMaterial({
        color: 0x00f5ff,
        emissive: 0x004466,
        roughness: 0.3,
        metalness: 0.8
      });
      ship = new THREE.Mesh(shipGeo, shipMat);
      ship.rotation.x = Math.PI / 2;
      ship.rotation.z = Math.PI;
      ship.position.y = 0.5;
      scene.add(ship);

      // Star Particles
      const starGeo = new THREE.BufferGeometry();
      const starCount = 800;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 60;
        starPositions[i + 1] = (Math.random() - 0.5) * 30 + 5;
        starPositions[i + 2] = -Math.random() * 260;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.25, transparent: true, opacity: 0.8 });
      stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      // Floor Grid
      const grid = new THREE.GridHelper(320, 50, 0x06b6d4, 0x1e293b);
      grid.position.y = 0;
      grid.position.z = -100;
      scene.add(grid);

      // Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', () => { isActivelyControlling = false; });
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerdown', () => { isActivelyControlling = true; });
      window.addEventListener('pointerup', () => { isActivelyControlling = false; });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchstart', () => { isActivelyControlling = true; }, { passive: true });
      window.addEventListener('touchend', () => { isActivelyControlling = false; });

      animate();
    }

    function triggerActiveThrust() {
      isActivelyControlling = true;
      clearTimeout(controlTimeout);
      controlTimeout = setTimeout(() => {
        isActivelyControlling = false;
      }, 650); // Chhodne ke baad 0.6 second me brake lag jayega
    }

    function spawnObstacle(zDistance) {
      const width = Math.random() * 3 + 2.2;
      const height = 2.2;
      const geo = new THREE.BoxGeometry(width, height, 1);
      const isPink = Math.random() > 0.5;
      const mat = new THREE.MeshStandardMaterial({
        color: isPink ? 0xff007f : 0x00f0ff,
        emissive: isPink ? 0x550028 : 0x003844,
        roughness: 0.3
      });
      const obs = new THREE.Mesh(geo, mat);
      const xPos = (Math.random() - 0.5) * (boundaryX * 1.6);
      obs.position.set(xPos, height / 2, zDistance);
      obs.userData = { width: width, height: height };
      scene.add(obs);
      obstacles.push(obs);
    }

    function spawnCoin(zDistance) {
      const geo = new THREE.CylinderGeometry(0.65, 0.65, 0.18, 16);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffb703,
        emissive: 0xfb8500,
        roughness: 0.2,
        metalness: 0.9
      });
      const coin = new THREE.Mesh(geo, mat);
      coin.rotation.x = Math.PI / 2;
      const xPos = (Math.random() - 0.5) * (boundaryX * 1.5);
      coin.position.set(xPos, 0.6, zDistance);
      scene.add(coin);
      coins.push(coin);
    }

    function startGame() {
      playSound('start');

      obstacles.forEach(obs => scene.remove(obs));
      obstacles = [];
      coins.forEach(c => scene.remove(c));
      coins = [];

      for (let i = -50; i > -260; i -= 45) {
        spawnObstacle(i);
        spawnCoin(i + 22);
      }

      score = 0;
      coinsCollected = 0;
      currentSpeed = cruiseSpeed;
      targetShipX = 0;
      ship.position.x = 0;
      isPlaying = true;

      document.getElementById('coinDisplay').innerText = '0';
      document.getElementById('gameOverlay').classList.add('hidden');
    }

    function gameOver() {
      playSound('crash');
      isPlaying = false;
      document.getElementById('mainTitle').innerText = "SYSTEM CRASH";
      document.getElementById('mainTitle').className = "text-4xl sm:text-6xl font-black text-rose-500 mb-2";
      document.getElementById('subTitle').innerHTML = `
        <span class="text-white font-bold block mb-1">Total Score: ${Math.floor(score)}</span>
        <span class="text-amber-400 font-bold block mb-1">🪙 Coins Looted: ${coinsCollected}</span>
        <span class="text-slate-400 text-xs">Top Velocity: ${Math.floor(currentSpeed * 140)} KM/H</span>
      `;
      document.getElementById('btnPlay').innerText = "TRY AGAIN";
      document.getElementById('gameOverlay').classList.remove('hidden');
    }

    function onKeyDown(e) {
      if (!isPlaying) return;
      triggerActiveThrust();
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        targetShipX = Math.max(-boundaryX, targetShipX - 2.5);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        targetShipX = Math.min(boundaryX, targetShipX + 2.5);
      }
    }

    function onPointerMove(e) {
      if (!isPlaying) return;
      triggerActiveThrust();
      const normalizedX = (e.clientX / window.innerWidth) * 2 - 1;
      targetShipX = normalizedX * boundaryX;
    }

    function onTouchMove(e) {
      if (!isPlaying) return;
      e.preventDefault();
      triggerActiveThrust();
      const touch = e.touches[0];
      const normalizedX = (touch.clientX / window.innerWidth) * 2 - 1;
      targetShipX = normalizedX * boundaryX;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying) {
        // Dynamic Throttle Acceleration & Deceleration
        if (isActivelyControlling) {
          currentSpeed = Math.min(maxBoostSpeed, currentSpeed + 0.015); // Accelerate
          document.getElementById('modeStatus').innerText = "⚡ HYPER BOOST";
          document.getElementById('modeStatus').className = "text-[10px] text-cyan-400 font-bold tracking-widest block";
        } else {
          currentSpeed = Math.max(cruiseSpeed, currentSpeed - 0.02); // Auto Slow Down / Brake
          document.getElementById('modeStatus').innerText = "🛡️ SLOW CRUISE";
          document.getElementById('modeStatus').className = "text-[10px] text-emerald-400 font-bold tracking-widest block";
        }

        const throttlePct = ((currentSpeed - cruiseSpeed) / (maxBoostSpeed - cruiseSpeed)) * 100;
        document.getElementById('throttleBar').style.width = throttlePct + '%';

        score += currentSpeed * 0.8;
        document.getElementById('scoreDisplay').innerText = Math.floor(score).toString().padStart(5, '0');
        document.getElementById('speedDisplay').innerText = Math.floor(currentSpeed * 140) + ' KM/H';

        // Steer Ship
        ship.position.x += (targetShipX - ship.position.x) * 0.09;
        ship.rotation.y = -(ship.position.x - targetShipX) * 0.16;
        camera.position.x = ship.position.x * 0.35;

        // Move stars
        const pos = stars.geometry.attributes.position.array;
        for (let i = 2; i < pos.length; i += 3) {
          pos[i] += currentSpeed * 2.5;
          if (pos[i] > 10) pos[i] = -260;
        }
        stars.geometry.attributes.position.needsUpdate = true;

        // Move & Collect Coins
        for (let i = coins.length - 1; i >= 0; i--) {
          const coin = coins[i];
          coin.position.z += currentSpeed;
          coin.rotation.z += 0.05;

          const dist = Math.hypot(coin.position.x - ship.position.x, coin.position.z - ship.position.z);
          if (dist < 1.3) {
            playSound('coin');
            coinsCollected++;
            score += 500;
            document.getElementById('coinDisplay').innerText = coinsCollected;
            scene.remove(coin);
            coins.splice(i, 1);
            spawnCoin(-240);
            continue;
          }

          if (coin.position.z > 10) {
            scene.remove(coin);
            coins.splice(i, 1);
            spawnCoin(-240);
          }
        }

        // Move obstacles & Collision
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += currentSpeed;

          if (Math.abs(obs.position.z - ship.position.z) < 0.9) {
            const halfWidth = obs.userData.width / 2 + 0.3;
            if (Math.abs(obs.position.x - ship.position.x) < halfWidth) {
              gameOver();
              break;
            }
          }

          if (obs.position.z > 10) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            spawnObstacle(-240);
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
