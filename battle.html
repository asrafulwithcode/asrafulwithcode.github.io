<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CYBER SURVIVOR: PROTOCOL 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { touch-action: none; user-select: none; -webkit-user-select: none; }
    body { margin: 0; overflow: hidden; background: #020617; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.25); }
    .glow-cyan { text-shadow: 0 0 15px rgba(6, 182, 212, 0.8); }
    .glow-red { text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
    .joy-stick-base { width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(56, 189, 248, 0.3); position: absolute; pointer-events: none; display: none; }
    .joy-stick-thumb { width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%); position: absolute; transform: translate(-50%, -50%); box-shadow: 0 0 20px #0284c7; }
  </style>
</head>
<body class="text-white">

  <!-- HUD Interface -->
  <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 sm:p-6 z-10">
    <div class="flex justify-between items-start">
      
      <!-- Back & Stats -->
      <div class="flex flex-col gap-2 pointer-events-auto">
        <a href="/" class="glass px-4 py-2 rounded-xl text-cyan-400 text-xs font-bold hover:border-cyan-400 transition w-fit">
          ← Exit
        </a>
        
        <!-- Health & Shield -->
        <div class="glass px-4 py-3 rounded-2xl flex flex-col gap-1.5 w-44 sm:w-56">
          <div class="flex justify-between text-[11px] font-bold text-slate-400">
            <span>HULL INTEGRITY</span>
            <span id="hpText" class="text-cyan-400">100%</span>
          </div>
          <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
            <div id="hpBar" class="h-full bg-gradient-to-r from-red-500 via-amber-400 to-cyan-400 transition-all duration-200" style="width: 100%;"></div>
          </div>
        </div>
      </div>

      <!-- Score, Wave & Weapon -->
      <div class="flex flex-col items-end gap-2">
        <div class="glass px-5 py-2.5 rounded-2xl text-right">
          <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-extrabold">Eliminations</div>
          <div id="killVal" class="text-2xl sm:text-3xl font-black text-white glow-cyan">0</div>
        </div>
        <div id="weaponBadge" class="glass px-3 py-1 rounded-xl text-[11px] font-bold text-amber-400 border-amber-500/30">
          WEAPON: PLASMA BLASTER
        </div>
      </div>
    </div>

    <!-- Mobile Dual Joysticks Info -->
    <div class="pointer-events-none sm:hidden flex justify-between text-[10px] text-slate-500 font-bold px-4 pb-2">
      <div>[DRAG LEFT] MOVE</div>
      <div>[DRAG RIGHT] AIM & FIRE</div>
    </div>
  </div>

  <!-- Joysticks Touch Overlays -->
  <div id="leftJoyBase" class="joy-stick-base z-10"><div id="leftJoyThumb" class="joy-stick-thumb"></div></div>
  <div id="rightJoyBase" class="joy-stick-base z-10"><div id="rightJoyThumb" class="joy-stick-thumb"></div></div>

  <!-- Start / Game Over Modal -->
  <div id="modal" class="absolute inset-0 flex items-center justify-center bg-black/85 backdrop-blur-md z-30">
    <div class="glass max-w-md w-full mx-4 p-8 rounded-3xl text-center border border-cyan-500/40 shadow-2xl shadow-cyan-500/20">
      <div class="inline-block p-2 px-4 bg-cyan-500/10 rounded-full border border-cyan-500/30 text-cyan-400 text-xs font-bold tracking-widest uppercase mb-4">
        3D Roguelike Arena
      </div>
      <h1 id="modalTitle" class="text-4xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-fuchsia-500 mb-2">
        CYBER SURVIVOR
      </h1>
      <p id="modalDesc" class="text-slate-400 text-xs sm:text-sm mb-6 leading-relaxed">
        Neutralize hostile cyber drones in deep space. Collect weapon power-ups and survive the relentless swarm.
      </p>

      <div id="scoreBox" class="hidden mb-6 bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
        <div class="text-xs text-slate-400 uppercase font-bold">Total Drones Eradicated</div>
        <div id="finalScore" class="text-4xl font-black text-cyan-400 glow-cyan">0</div>
      </div>

      <button id="startBtn" onclick="initGame()" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-cyan-500/30 transition transform active:scale-95">
        DEPLOY DRONE
      </button>
    </div>
  </div>

  <script>
    // Audio Synthesizer (Zero External Assets)
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sound(freq, type, dur, vol = 0.1) {
      if (audio.state === 'suspended') audio.resume();
      const osc = audio.createOscillator();
      const g = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audio.currentTime);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      osc.connect(g);
      g.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + dur);
    }

    // Three.js Scene Setup
    let scene, camera, renderer, playerMech, gridFloor;
    let isPlaying = false, kills = 0, playerHp = 100;
    let playerMove = { x: 0, z: 0 };
    let playerLook = { x: 0, z: 0 };
    let bullets = [], enemies = [], sparks = [], loot = [];
    let keys = {};
    let mouse = new THREE.Vector2();
    let raycaster = new THREE.Raycaster();
    let groundPlane;
    let weaponLevel = 1;

    function build3DWorld() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.02);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 24, 18);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Cyberpunk Grid Floor
      gridFloor = new THREE.GridHelper(100, 50, 0x06b6d4, 0x0f172a);
      gridFloor.position.y = -0.05;
      scene.add(gridFloor);

      // Invisible Raycast Floor Plane
      const planeGeo = new THREE.PlaneGeometry(200, 200);
      planeGeo.rotateX(-Math.PI / 2);
      groundPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
      scene.add(groundPlane);

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const mainLight = new THREE.PointLight(0x38bdf8, 2, 60);
      mainLight.position.set(0, 15, 0);
      scene.add(mainLight);

      // Build 3D Futuristic Mech Craft
      playerMech = new THREE.Group();

      const hullGeo = new THREE.ConeGeometry(0.9, 2.4, 5);
      hullGeo.rotateX(Math.PI / 2);
      const hullMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
      const hull = new THREE.Mesh(hullGeo, hullMat);
      playerMech.add(hull);

      const wingGeo = new THREE.BoxGeometry(2.8, 0.1, 0.8);
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1 });
      const wings = new THREE.Mesh(wingGeo, wingMat);
      wings.position.set(0, 0, 0.2);
      playerMech.add(wings);

      // Glowing Cockpit
      const cockpit = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      cockpit.position.set(0, 0.3, -0.2);
      playerMech.add(cockpit);

      // Jet Thrusters
      const thruster = new THREE.PointLight(0x06b6d4, 3, 4);
      thruster.position.set(0, 0, 1.2);
      playerMech.add(thruster);

      playerMech.position.y = 0.5;
      scene.add(playerMech);

      renderLoop();
    }

    // Touch & Joystick Input Handling
    let leftTouch = null, rightTouch = null;
    const lBase = document.getElementById('leftJoyBase'), lThumb = document.getElementById('leftJoyThumb');
    const rBase = document.getElementById('rightJoyBase'), rThumb = document.getElementById('rightJoyThumb');

    window.addEventListener('touchstart', (e) => {
      for (let t of e.changedTouches) {
        if (t.clientX < window.innerWidth / 2 && leftTouch === null) {
          leftTouch = { id: t.identifier, startX: t.clientX, startY: t.clientY };
          lBase.style.left = (t.clientX - 60) + 'px';
          lBase.style.top = (t.clientY - 60) + 'px';
          lThumb.style.left = '60px'; lThumb.style.top = '60px';
          lBase.style.display = 'block';
        } else if (t.clientX >= window.innerWidth / 2 && rightTouch === null) {
          rightTouch = { id: t.identifier, startX: t.clientX, startY: t.clientY };
          rBase.style.left = (t.clientX - 60) + 'px';
          rBase.style.top = (t.clientY - 60) + 'px';
          rThumb.style.left = '60px'; rThumb.style.top = '60px';
          rBase.style.display = 'block';
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      for (let t of e.changedTouches) {
        if (leftTouch && t.identifier === leftTouch.id) {
          let dx = t.clientX - leftTouch.startX, dy = t.clientY - leftTouch.startY;
          let dist = Math.hypot(dx, dy);
          if (dist > 50) { dx = (dx / dist) * 50; dy = (dy / dist) * 50; }
          lThumb.style.left = (60 + dx) + 'px'; lThumb.style.top = (60 + dy) + 'px';
          playerMove.x = dx / 50;
          playerMove.z = dy / 50;
        } else if (rightTouch && t.identifier === rightTouch.id) {
          let dx = t.clientX - rightTouch.startX, dy = t.clientY - rightTouch.startY;
          let dist = Math.hypot(dx, dy);
          if (dist > 50) { dx = (dx / dist) * 50; dy = (dy / dist) * 50; }
          rThumb.style.left = (60 + dx) + 'px'; rThumb.style.top = (60 + dy) + 'px';
          if (dist > 12) {
            playerLook.x = dx / dist;
            playerLook.z = dy / dist;
          }
        }
      }
    });

    function endTouches(e) {
      for (let t of e.changedTouches) {
        if (leftTouch && t.identifier === leftTouch.id) {
          leftTouch = null; lBase.style.display = 'none'; playerMove = { x: 0, z: 0 };
        }
        if (rightTouch && t.identifier === rightTouch.id) {
          rightTouch = null; rBase.style.display = 'none'; playerLook = { x: 0, z: 0 };
        }
      }
    }
    window.addEventListener('touchend', endTouches);
    window.addEventListener('touchcancel', endTouches);

    // Desktop Keyboard & Mouse Handling
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let isMouseDown = false;
    window.addEventListener('mousedown', e => { if (e.button === 0) isMouseDown = true; });
    window.addEventListener('mouseup', e => { if (e.button === 0) isMouseDown = false; });
    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Spawning Mechanics
    function spawnBullet(origin, dir, spread = 0) {
      const geo = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 6);
      geo.rotateX(Math.PI / 2);
      const mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const bullet = new THREE.Mesh(geo, mat);

      bullet.position.copy(origin);
      const angle = Math.atan2(dir.x, dir.z) + spread;
      bullet.rotation.y = angle;

      bullet.vel = new THREE.Vector3(Math.sin(angle) * 0.9, 0, Math.cos(angle) * 0.9);
      bullet.life = 45;

      scene.add(bullet);
      bullets.push(bullet);
      sound(800 + Math.random() * 200, 'square', 0.04, 0.06);
    }

    function spawnDrone() {
      const angle = Math.random() * Math.PI * 2;
      const dist = 32 + Math.random() * 8;
      const x = playerMech.position.x + Math.cos(angle) * dist;
      const z = playerMech.position.z + Math.sin(angle) * dist;

      const isElite = Math.random() > 0.85;
      const geo = new THREE.OctahedronGeometry(isElite ? 1.0 : 0.65);
      const mat = new THREE.MeshStandardMaterial({
        color: isElite ? 0xf43f5e : 0xa855f7,
        emissive: isElite ? 0x991b1b : 0x581c87,
        metalness: 0.9,
        roughness: 0.2
      });
      const drone = new THREE.Mesh(geo, mat);
      drone.position.set(x, 0.6, z);
      drone.hp = isElite ? 4 : 1;
      drone.speed = isElite ? 0.08 : 0.12;
      drone.isElite = isElite;

      scene.add(drone);
      enemies.push(drone);
    }

    function createExplosion(pos, color) {
      for (let i = 0; i < 15; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 6, 6),
          new THREE.MeshBasicMaterial({ color })
        );
        p.position.copy(pos);
        p.vel = new THREE.Vector3(
          (Math.random() - 0.5) * 0.5,
          Math.random() * 0.4,
          (Math.random() - 0.5) * 0.5
        );
        p.life = 30;
        scene.add(p);
        sparks.push(p);
      }
      sound(120, 'sawtooth', 0.15, 0.2);
    }

    let fireTimer = 0, spawnTimer = 0;

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      if (isPlaying) {
        // Desktop Movement
        if (!leftTouch) {
          let mx = 0, mz = 0;
          if (keys['w'] || keys['arrowup']) mz -= 1;
          if (keys['s'] || keys['arrowdown']) mz += 1;
          if (keys['a'] || keys['arrowleft']) mx -= 1;
          if (keys['d'] || keys['arrowright']) mx += 1;
          if (mx !== 0 && mz !== 0) { mx *= 0.7071; mz *= 0.7071; }
          playerMove.x = mx;
          playerMove.z = mz;
        }

        // Apply Player Position
        const moveSpeed = 0.22;
        playerMech.position.x += playerMove.x * moveSpeed;
        playerMech.position.z += playerMove.z * moveSpeed;

        // Camera Follows with Smooth Lerp
        camera.position.x += (playerMech.position.x - camera.position.x) * 0.08;
        camera.position.z += (playerMech.position.z + 18 - camera.position.z) * 0.08;

        // Desktop Aim with Mouse Raycast
        if (!rightTouch) {
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObject(groundPlane);
          if (hits.length > 0) {
            const hitPos = hits[0].point;
            const lookAngle = Math.atan2(hitPos.x - playerMech.position.x, hitPos.z - playerMech.position.z);
            playerMech.rotation.y = lookAngle;
          }
        } else if (playerLook.x !== 0 || playerLook.z !== 0) {
          playerMech.rotation.y = Math.atan2(playerLook.x, playerLook.z);
        }

        // Banking tilt when moving
        playerMech.rotation.z = -playerMove.x * 0.35;

        // Auto/Manual Firing
        fireTimer++;
        const shouldFire = isMouseDown || (rightTouch && (playerLook.x !== 0 || playerLook.z !== 0));
        if (shouldFire && fireTimer > (weaponLevel === 1 ? 12 : 8)) {
          const forward = new THREE.Vector3(Math.sin(playerMech.rotation.y), 0, Math.cos(playerMech.rotation.y));
          if (weaponLevel === 1) {
            spawnBullet(playerMech.position, forward);
          } else {
            // Triple Shot
            spawnBullet(playerMech.position, forward, -0.15);
            spawnBullet(playerMech.position, forward, 0);
            spawnBullet(playerMech.position, forward, 0.15);
          }
          fireTimer = 0;
        }

        // Enemy Waves
        spawnTimer++;
        const currentRate = Math.max(20, 60 - Math.floor(kills / 6));
        if (spawnTimer > currentRate) {
          spawnDrone();
          spawnTimer = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.vel);
          b.life--;

          // Hit Collision
          let hit = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            if (b.position.distanceTo(en.position) < (en.isElite ? 1.2 : 0.8)) {
              en.hp--;
              createExplosion(b.position, 0x38bdf8);
              hit = true;

              if (en.hp <= 0) {
                createExplosion(en.position, en.isElite ? 0xf43f5e : 0xa855f7);
                scene.remove(en);
                enemies.splice(j, 1);
                kills++;
                document.getElementById('killVal').innerText = kills;

                // Upgrade weapon at 15 kills
                if (kills === 15) {
                  weaponLevel = 2;
                  document.getElementById('weaponBadge').innerText = "WEAPON: TRIPLE PLASMACASTER";
                  document.getElementById('weaponBadge').classList.replace('text-amber-400', 'text-cyan-400');
                }
              }
              break;
            }
          }

          if (hit || b.life <= 0) {
            scene.remove(b);
            bullets.splice(i, 1);
          }
        }

        // Update Drones
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          const dir = new THREE.Vector3().subVectors(playerMech.position, en.position).normalize();
          en.position.addScaledVector(dir, en.speed);
          en.rotation.x += 0.05;
          en.rotation.y += 0.03;

          // Drone Attacks Mech
          if (en.position.distanceTo(playerMech.position) < 1.1) {
            playerHp -= en.isElite ? 25 : 12;
            createExplosion(playerMech.position, 0xef4444);
            scene.remove(en);
            enemies.splice(i, 1);

            document.getElementById('hpBar').style.width = Math.max(0, playerHp) + '%';
            document.getElementById('hpText').innerText = Math.max(0, playerHp) + '%';

            if (playerHp <= 0) {
              endGame();
              break;
            }
          }
        }

        // Update Sparks / Particles
        for (let i = sparks.length - 1; i >= 0; i--) {
          const sp = sparks[i];
          sp.position.add(sp.vel);
          sp.life--;
          sp.scale.multiplyScalar(0.92);
          if (sp.life <= 0) {
            scene.remove(sp);
            sparks.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    function initGame() {
      document.getElementById('modal').classList.add('hidden');
      // Clear Arena
      bullets.forEach(b => scene.remove(b));
      enemies.forEach(e => scene.remove(e));
      sparks.forEach(s => scene.remove(s));
      bullets = []; enemies = []; sparks = [];

      playerMech.position.set(0, 0.5, 0);
      playerHp = 100;
      kills = 0;
      weaponLevel = 1;
      document.getElementById('hpBar').style.width = '100%';
      document.getElementById('hpText').innerText = '100%';
      document.getElementById('killVal').innerText = '0';
      document.getElementById('weaponBadge').innerText = "WEAPON: PLASMA BLASTER";
      isPlaying = true;
      sound(440, 'triangle', 0.2);
    }

    function endGame() {
      isPlaying = false;
      document.getElementById('modalTitle').innerText = "HULL BREACHED";
      document.getElementById('modalDesc').innerText = "Your mech succumbed to the combat swarm.";
      document.getElementById('scoreBox').classList.remove('hidden');
      document.getElementById('finalScore').innerText = kills;
      document.getElementById('startBtn').innerText = "REPAIR & RE-ENGAGE";
      document.getElementById('modal').classList.remove('hidden');
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    build3DWorld();
  </script>
</body>
</html>
