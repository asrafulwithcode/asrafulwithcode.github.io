<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CYBER STRIKE: SURVIVOR - FinGrowTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { touch-action: none; user-select: none; -webkit-user-select: none; }
    body { margin: 0; overflow: hidden; background: #05050d; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .neon-text { text-shadow: 0 0 12px rgba(6, 182, 212, 0.8); }
    .joystick-base { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(6,182,212,0.4); position: absolute; display: none; }
    .joystick-thumb { width: 50px; height: 50px; border-radius: 50%; background: #06b6d4; box-shadow: 0 0 15px #06b6d4; position: absolute; transform: translate(-50%, -50%); }
  </style>
</head>
<body class="font-sans text-white">

  <!-- HUD Overlay -->
  <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10">
    <div class="flex justify-between items-center">
      <a href="/" class="pointer-events-auto bg-slate-900/90 border border-cyan-500/40 px-3 py-1.5 rounded-xl text-cyan-400 text-xs font-bold hover:bg-cyan-500/20">
        ← Home
      </a>
      
      <!-- HP Bar -->
      <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
        <span class="text-xs font-bold text-red-400">HP</span>
        <div class="w-24 sm:w-36 h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
          <div id="hpFill" class="h-full bg-gradient-to-r from-red-600 to-green-500 transition-all duration-150" style="width: 100%;"></div>
        </div>
      </div>

      <!-- Kills & Wave -->
      <div class="bg-slate-900/80 px-3 py-1.5 rounded-xl border border-cyan-500/30 text-right">
        <div class="text-[10px] uppercase tracking-wider text-cyan-400 font-bold">Kills</div>
        <div id="killsVal" class="text-base sm:text-xl font-black text-white">0</div>
      </div>
    </div>

    <!-- On-screen Fire Button for Mobile -->
    <div class="pointer-events-auto sm:hidden flex justify-end pb-6 pr-4">
      <button id="fireBtn" class="w-20 h-20 bg-red-600/80 active:bg-red-500 border-2 border-red-400 rounded-full text-white font-black text-lg shadow-lg shadow-red-600/40 flex items-center justify-center">
        FIRE
      </button>
    </div>
  </div>

  <!-- Touch Joystick Elements -->
  <div id="joyBase" class="joystick-base pointer-events-none z-10">
    <div id="joyThumb" class="joystick-thumb"></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Start & Game Over Screen -->
  <div id="overlay" class="absolute inset-0 flex items-center justify-center bg-black/85 backdrop-blur-md z-20">
    <div class="max-w-md w-full mx-4 p-8 bg-slate-900 border border-cyan-500/40 rounded-3xl text-center shadow-2xl shadow-cyan-500/20">
      <div class="inline-block p-2 px-4 bg-cyan-500/10 rounded-full border border-cyan-500/30 text-cyan-400 text-xs font-bold uppercase tracking-wider mb-3">
        Roguelike Survival Shooter
      </div>
      <h1 id="titleText" class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-red-500 mb-2">
        CYBER STRIKE
      </h1>
      <p id="subText" class="text-slate-400 text-xs sm:text-sm mb-6 leading-relaxed">
        PC: Move with <strong class="text-cyan-300">W, A, S, D</strong>. Aim & Shoot with <strong class="text-cyan-300">Mouse</strong>.<br>
        Mobile: Drag left side to walk, tap <strong class="text-red-400">FIRE</strong> to attack!
      </p>

      <div id="scoreCard" class="hidden mb-6 bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <div class="text-xs text-slate-400">Total Enemies Eliminated</div>
        <div id="finalScore" class="text-3xl font-extrabold text-cyan-400">0</div>
      </div>

      <button id="startBtn" onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-cyan-500/30 transition transform active:scale-95">
        START BATTLE
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Sound FX using Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration, vol=0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game Variables
    let isPlaying = false;
    let kills = 0;
    let shake = 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 16,
      hp: 100,
      maxHp: 100,
      speed: 3.8,
      angle: 0
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2, isDown: false };
    let mobileFire = false;

    // Mobile Virtual Joystick State
    let touchJoyId = null;
    let joyStart = { x: 0, y: 0 };
    let joyDir = { x: 0, y: 0 };
    const joyBase = document.getElementById('joyBase');
    const joyThumb = document.getElementById('joyThumb');

    // Keyboard Listeners
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Mouse Listeners
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mousedown', e => {
      if (e.button === 0) mouse.isDown = true;
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) mouse.isDown = false;
    });

    // Mobile Fire Button
    const fireBtn = document.getElementById('fireBtn');
    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); mobileFire = true; });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); mobileFire = false; });

    // Touch Joystick Handlers
    window.addEventListener('touchstart', (e) => {
      for (let t of e.changedTouches) {
        if (t.clientX < window.innerWidth / 2 && touchJoyId === null) {
          touchJoyId = t.identifier;
          joyStart = { x: t.clientX, y: t.clientY };
          joyBase.style.left = (joyStart.x - 55) + 'px';
          joyBase.style.top = (joyStart.y - 55) + 'px';
          joyThumb.style.left = '55px';
          joyThumb.style.top = '55px';
          joyBase.style.display = 'block';
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      for (let t of e.changedTouches) {
        if (t.identifier === touchJoyId) {
          let dx = t.clientX - joyStart.x;
          let dy = t.clientY - joyStart.y;
          let dist = Math.hypot(dx, dy);
          let maxDist = 45;
          if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
          }
          joyThumb.style.left = (55 + dx) + 'px';
          joyThumb.style.top = (55 + dy) + 'px';
          joyDir = { x: dx / maxDist, y: dy / maxDist };
        }
      }
    });

    window.addEventListener('touchend', (e) => {
      for (let t of e.changedTouches) {
        if (t.identifier === touchJoyId) {
          touchJoyId = null;
          joyDir = { x: 0, y: 0 };
          joyBase.style.display = 'none';
        }
      }
    });

    function spawnEnemy() {
      const edge = Math.floor(Math.random() * 4);
      let x, y;
      if (edge === 0) { x = Math.random() * canvas.width; y = -30; }
      else if (edge === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
      else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
      else { x = -30; y = Math.random() * canvas.height; }

      const isFast = Math.random() > 0.75;
      enemies.push({
        x, y,
        r: isFast ? 12 : 16,
        hp: isFast ? 1 : 2,
        speed: isFast ? 2.5 : 1.6,
        color: isFast ? '#f43f5e' : '#a855f7'
      });
    }

    function shoot() {
      bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        vx: Math.cos(player.angle) * 11,
        vy: Math.sin(player.angle) * 11,
        life: 55
      });
      playBeep(650, 'triangle', 0.06, 0.12);
      shake = 3;
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          r: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    let fireTick = 0;
    let spawnTick = 0;

    function gameLoop() {
      requestAnimationFrame(gameLoop);

      // Camera Shake
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.88;
      }

      // Background wipe
      ctx.fillStyle = '#060714';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      const gridSize = 45;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      if (isPlaying) {
        // Player Movement (Keyboard + Joystick)
        let moveX = 0, moveY = 0;
        if (keys['w'] || keys['arrowup']) moveY -= 1;
        if (keys['s'] || keys['arrowdown']) moveY += 1;
        if (keys['a'] || keys['arrowleft']) moveX -= 1;
        if (keys['d'] || keys['arrowright']) moveX += 1;

        if (joyDir.x !== 0 || joyDir.y !== 0) {
          moveX = joyDir.x;
          moveY = joyDir.y;
        } else if (moveX !== 0 && moveY !== 0) {
          moveX *= 0.7071;
          moveY *= 0.7071;
        }

        player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x + moveX * player.speed));
        player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y + moveY * player.speed));

        // Aiming Logic (Mouse or closest enemy on mobile)
        if (window.innerWidth <= 768 && enemies.length > 0) {
          // Auto-target closest enemy for mobile
          let nearest = enemies[0];
          let minDist = Math.hypot(nearest.x - player.x, nearest.y - player.y);
          for (let e of enemies) {
            let d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
          player.angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
        } else {
          player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        }

        // Firing Logic
        fireTick++;
        if ((mouse.isDown || mobileFire) && fireTick > 10) {
          shoot();
          fireTick = 0;
        }

        // Spawn Enemies
        spawnTick++;
        const spawnRate = Math.max(22, 60 - Math.floor(kills / 5));
        if (spawnTick > spawnRate) {
          spawnEnemy();
          spawnTick = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.y += b.vy;
          b.life--;

          // Draw Bullet
          ctx.beginPath();
          ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;

          if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
          }

          // Bullet vs Enemy Hit
          for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            if (Math.hypot(b.x - en.x, b.y - en.y) < b.life && Math.hypot(b.x - en.x, b.y - en.y) < en.r + 3.5) {
              en.hp--;
              bullets.splice(i, 1);
              createExplosion(en.x, en.y, en.color);

              if (en.hp <= 0) {
                enemies.splice(j, 1);
                kills++;
                document.getElementById('killsVal').innerText = kills;
                playBeep(220, 'square', 0.08, 0.15);
              }
              break;
            }
          }
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          const angle = Math.atan2(player.y - en.y, player.x - en.x);
          en.x += Math.cos(angle) * en.speed;
          en.y += Math.sin(angle) * en.speed;

          // Draw Enemy
          ctx.beginPath();
          ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
          ctx.fillStyle = en.color;
          ctx.shadowColor = en.color;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Enemy Collision with Player
          if (Math.hypot(en.x - player.x, en.y - player.y) < en.r + player.r) {
            player.hp -= 15;
            shake = 8;
            playBeep(110, 'sawtooth', 0.15, 0.25);
            createExplosion(player.x, player.y, '#ef4444');
            enemies.splice(i, 1);
            document.getElementById('hpFill').style.width = Math.max(0, player.hp) + '%';

            if (player.hp <= 0) {
              gameOver();
              break;
            }
          }
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.035;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fill();
          ctx.globalAlpha = 1;
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        // Draw Player Ship
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);
        ctx.beginPath();
        ctx.moveTo(player.r + 4, 0);
        ctx.lineTo(-player.r, -player.r + 4);
        ctx.lineTo(-player.r / 2, 0);
        ctx.lineTo(-player.r, player.r - 4);
        ctx.closePath();
        ctx.fillStyle = '#06b6d4';
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      ctx.restore();
    }

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.hp = 100;
      kills = 0;
      bullets = [];
      enemies = [];
      particles = [];
      document.getElementById('hpFill').style.width = '100%';
      document.getElementById('killsVal').innerText = '0';
      isPlaying = true;
      playBeep(440, 'sine', 0.2);
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('titleText').innerText = 'BASE OVERRUN';
      document.getElementById('subText').innerText = 'Your ship ran out of shields.';
      document.getElementById('scoreCard').classList.remove('hidden');
      document.getElementById('finalScore').innerText = kills + ' Kills';
      document.getElementById('startBtn').innerText = 'RESPAWN';
      document.getElementById('overlay').classList.remove('hidden');
    }

    gameLoop();
  </script>
</body>
</html>
