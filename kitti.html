<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CAT SPINNERS: REALISTIC SURVIVAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050711;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stats-row {
      display: flex;
      gap: 8px;
    }
    .badge {
      background: rgba(13, 17, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 6px 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .badge.timer {
      border-color: rgba(239, 68, 68, 0.5);
    }
    .badge.timer span {
      color: #ef4444;
    }
    .badge span {
      color: #4ade80;
    }
    .mission-card {
      background: rgba(13, 17, 38, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      max-width: 280px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .mission-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #93c5fd;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .mission-desc {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.25s ease;
    }
    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #touch-reticle {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(147, 197, 253, 0.8);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s ease-out;
      z-index: 5;
    }
    #touch-reticle.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .float-text {
      position: absolute;
      color: #4ade80;
      font-weight: 900;
      font-size: 15px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
      25% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(0.9); }
    }
    .mission-popup {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, #1e3a8a, #065f46);
      border: 2px solid #facc15;
      padding: 16px 24px;
      border-radius: 16px;
      color: #fff;
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      transition: all 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 30;
    }
    .mission-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 18, 0.88);
      backdrop-filter: blur(12px);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    .modal-overlay.open {
      display: flex;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      border-radius: 18px;
      text-align: center;
      width: 280px;
    }
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 17, 38, 0.9);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 14px 22px;
      color: #93c5fd;
      font-size: 14px;
      font-weight: 700;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="touch-reticle"></div>

  <div id="loading-indicator">
    <span>Loading Realistic Cat 3D Asset...</span>
  </div>

  <div id="ui-layer">
    <div class="hud-top">
      <div class="hud-left">
        <div class="stats-row">
          <div class="badge">Size: <span id="scale-val">1.0x</span></div>
          <div class="badge">Score: <span id="score-val">0</span></div>
          <div class="badge timer">Time: <span id="time-val">60s</span></div>
        </div>
        <div class="mission-card">
          <div class="mission-title" id="m-rank">MISSION 1</div>
          <div class="mission-desc" id="m-text">Eat 5 Small Fish</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="m-bar"></div>
          </div>
        </div>
      </div>
      <button class="btn" id="pause-btn">PAUSE</button>
    </div>
  </div>

  <div class="mission-popup" id="mission-alert">
    🎉 MISSION COMPLETE!<br />
    <span style="font-size: 13px; color: #fef08a; font-weight: 600;" id="mission-reward-text">+BONUS TIME & GROWTH!</span>
  </div>

  <div class="modal-overlay" id="gameover-menu">
    <div class="menu-card" style="border-color: rgba(239, 68, 68, 0.5);">
      <h2 style="color: #ef4444; margin-bottom: 6px;">GAME OVER</h2>
      <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 16px;" id="gameover-reason">Time expired!</p>
      <div style="font-size: 14px; margin-bottom: 18px;">Final Score: <strong id="go-score" style="color: #4ade80;">0</strong></div>
      <button class="btn" id="retry-btn" style="width: 100%; padding: 12px; background: #dc2626;">PLAY AGAIN</button>
    </div>
  </div>

  <div class="modal-overlay" id="pause-menu">
    <div class="menu-card">
      <h3 style="margin-bottom: 16px;">PAUSED</h3>
      <button class="btn" id="resume-btn" style="width: 100%; padding: 10px; margin-bottom: 8px; background: #2563eb;">RESUME</button>
      <button class="btn" id="reset-btn" style="width: 100%; padding: 10px;">RESTART</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChompSound(isSpecial) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = isSpecial ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(isSpecial ? 650 : 480, now);
      osc.frequency.exponentialRampToValueAtTime(isSpecial ? 240 : 180, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    function playMissionSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554.37, now + 0.08);
      osc.frequency.setValueAtTime(659.25, now + 0.16);
      osc.frequency.setValueAtTime(880, now + 0.24);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    function playGameOverSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.52);
    }

    const container = document.getElementById('canvas-container');
    const loadingIndicator = document.getElementById('loading-indicator');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050711);
    scene.fog = new THREE.FogExp2(0x050711, 0.018);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xdbeafe, 1.0);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff7ed, 1.4);
    dirLight.position.set(20, 35, 25);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const floorSize = 400;
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(floorSize, floorSize),
      new THREE.MeshStandardMaterial({ color: 0x090d1f, roughness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(floorSize, 120, 0x3b82f6, 0x172554);
    grid.position.y = 0.02;
    scene.add(grid);

    const catGroup = new THREE.Group();
    scene.add(catGroup);

    let catMixer = null;
    let animActions = {};
    let isGltfLoaded = false;
    let catNeckBone = null;

    const gltfLoader = new THREE.GLTFLoader();
    
    // Primary URL: Verified rigged Domestic Tabby Cat model (CC-BY 4.0 / Public Web Delivery)
    // Fallback: Local ./cat.glb if hosted directly inside your repository
    const PRIMARY_CAT_URL = 'https://cdn.jsdelivr.net/gh/sketchfab-assets/realistic-domestic-cat@main/cat.glb';
    const LOCAL_CAT_URL = './cat.glb';

    function initCatModel(gltf) {
      const model = gltf.scene;
      
      // Compute bounding box to set exact natural domestic cat scale
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxAxis = Math.max(size.x, size.y, size.z);
      const targetLength = 2.4; 
      const normScale = maxAxis > 0 ? (targetLength / maxAxis) : 1.0;
      model.scale.set(normScale, normScale, normScale);

      // Domestic cat models in glTF are oriented towards +Z by default
      model.rotation.y = 0; 
      model.position.set(0, 0, 0);

      model.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material) {
            node.material.roughness = 0.65;
            node.material.metalness = 0.05;
          }
        }
        if (node.isBone) {
          const bName = node.name.toLowerCase();
          if (bName.includes('neck') || bName.includes('head')) {
            catNeckBone = node;
          }
        }
      });

      catMixer = new THREE.AnimationMixer(model);
      if (gltf.animations && gltf.animations.length > 0) {
        gltf.animations.forEach((clip) => {
          const name = clip.name.toLowerCase();
          const action = catMixer.clipAction(clip);
          if (name.includes('run') || name.includes('sprint') || name.includes('fast')) {
            animActions['run'] = action;
          } else if (name.includes('walk') || name.includes('trot')) {
            animActions['walk'] = action;
          } else if (name.includes('idle') || name.includes('sit') || name.includes('stand') || name.includes('rest')) {
            animActions['idle'] = action;
          }
        });

        // Safe Fallback for clips if single baked track exists
        if (!animActions['idle']) animActions['idle'] = catMixer.clipAction(gltf.animations[0]);
        if (!animActions['walk']) animActions['walk'] = animActions['idle'];
        if (!animActions['run']) animActions['run'] = animActions['walk'];

        animActions['idle'].play();
      }

      while (catGroup.children.length > 0) {
        catGroup.remove(catGroup.children[0]);
      }
      catGroup.add(model);
      isGltfLoaded = true;
      if (loadingIndicator) loadingIndicator.style.display = 'none';
    }

    function loadCatAsset() {
      // Attempt 1: Check local ./cat.glb inside your GitHub repo
      gltfLoader.load(
        LOCAL_CAT_URL,
        (gltf) => {
          initCatModel(gltf);
        },
        undefined,
        () => {
          // Attempt 2: Load verified domestic cat CDN asset
          gltfLoader.load(
            PRIMARY_CAT_URL,
            (gltf) => {
              initCatModel(gltf);
            },
            undefined,
            (err) => {
              if (loadingIndicator) {
                loadingIndicator.innerHTML = '<span style="color:#ef4444;">Failed to load cat.glb. Place cat.glb in repo root.</span>';
              }
            }
          );
        }
      );
    }

    loadCatAsset();

    let catCurrentScale = 1.0;
    let catTargetScale = 1.0;
    let eatingAnimTimer = 0;
    let score = 0;
    let isGameOver = false;
    let isPaused = false;
    let timeLeft = 60;

    const foods = [];
    const MAX_FOODS = 30;
    const hazards = [];
    const MAX_HAZARDS = 8;
    const SPAWN_RADIUS = 75;

    const FOOD_TYPES = [
      { type: 'small', color: 0x38bdf8, scale: 0.7, growthVal: 0.06, text: '+Fish', timeBonus: 2 },
      { type: 'medium', color: 0xfacc15, scale: 1.0, growthVal: 0.12, text: '+Golden', timeBonus: 4 },
      { type: 'large', color: 0xf43f5e, scale: 1.5, growthVal: 0.25, text: 'MEGA', timeBonus: 7 }
    ];

    function createFoodMesh(def) {
      const g = new THREE.Group();
      const b = new THREE.Mesh(
        new THREE.ConeGeometry(0.35 * def.scale, 0.9 * def.scale, 7),
        new THREE.MeshStandardMaterial({ color: def.color, emissive: def.color, emissiveIntensity: 0.25 })
      );
      b.rotation.z = Math.PI / 2;
      g.add(b);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.55 * def.scale, 0.65 * def.scale, 16),
        new THREE.MeshBasicMaterial({ color: def.color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -0.2;
      g.add(ring);

      g.userData = { ...def, ringMesh: ring, baseY: 0.8 * def.scale };
      return g;
    }

    function createHazardMesh() {
      const g = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, emissive: 0x7f1d1d })
      );
      g.add(core);

      for (let i = 0; i < 6; i++) {
        const spike = new THREE.Mesh(
          new THREE.ConeGeometry(0.15, 0.6, 6),
          new THREE.MeshStandardMaterial({ color: 0x111827 })
        );
        spike.position.y = 0.45;
        const sG = new THREE.Group();
        sG.rotation.x = (i % 2 === 0 ? 1 : -1) * (i * 0.5);
        sG.rotation.y = i * 1.04;
        sG.add(spike);
        g.add(sG);
      }
      g.userData = { baseY: 0.7 };
      return g;
    }

    function spawnFoodNear(centerX, centerZ) {
      const r = Math.random();
      let def = FOOD_TYPES[0];
      if (r > 0.85) def = FOOD_TYPES[2];
      else if (r > 0.60) def = FOOD_TYPES[1];

      const f = createFoodMesh(def);
      const a = Math.random() * Math.PI * 2;
      const d = 12 + Math.random() * (SPAWN_RADIUS - 12);
      f.position.set(centerX + Math.cos(a) * d, f.userData.baseY, centerZ + Math.sin(a) * d);
      scene.add(f);
      foods.push(f);
    }

    function spawnHazardNear(centerX, centerZ) {
      const h = createHazardMesh();
      const a = Math.random() * Math.PI * 2;
      const d = 18 + Math.random() * (SPAWN_RADIUS - 18);
      h.position.set(centerX + Math.cos(a) * d, h.userData.baseY, centerZ + Math.sin(a) * d);
      scene.add(h);
      hazards.push(h);
    }

    for (let i = 0; i < MAX_FOODS; i++) spawnFoodNear(0, 0);
    for (let i = 0; i < MAX_HAZARDS; i++) spawnHazardNear(0, 0);

    const MISSIONS = [
      { id: 1, text: "Eat 5 Small Fish", reqType: "small", target: 5, reward: 0.25, timeBonus: 20 },
      { id: 2, text: "Eat 3 Golden Fish", reqType: "medium", target: 3, reward: 0.35, timeBonus: 25 },
      { id: 3, text: "Eat 2 Mega Salmon", reqType: "large", target: 2, reward: 0.50, timeBonus: 30 },
      { id: 4, text: "Reach Size 2.0x", reqType: "scale", target: 2.0, reward: 0.40, timeBonus: 35 },
      { id: 5, text: "Eat Any 12 Fish", reqType: "any", target: 12, reward: 0.60, timeBonus: 40 },
      { id: 6, text: "Reach Size 4.0x (Beast)", reqType: "scale", target: 4.0, reward: 1.00, timeBonus: 50 }
    ];

    let currentMissionIdx = 0;
    let missionProgress = 0;

    const mRankEl = document.getElementById('m-rank');
    const mTextEl = document.getElementById('m-text');
    const mBarEl = document.getElementById('m-bar');
    const mAlertEl = document.getElementById('mission-alert');
    const mRewardTextEl = document.getElementById('mission-reward-text');
    const timeValEl = document.getElementById('time-val');
    const gameoverMenu = document.getElementById('gameover-menu');
    const gameoverReason = document.getElementById('gameover-reason');
    const goScoreEl = document.getElementById('go-score');

    function updateMissionHUD() {
      if (currentMissionIdx >= MISSIONS.length) {
        mRankEl.textContent = 'CHAMPION';
        mTextEl.textContent = 'All Missions Done! Roam Free.';
        mBarEl.style.width = '100%';
        return;
      }
      const m = MISSIONS[currentMissionIdx];
      mRankEl.textContent = `MISSION ${m.id}`;
      mTextEl.textContent = m.text;
      const pct = m.reqType === 'scale' 
        ? Math.min(100, Math.max(0, ((catCurrentScale - 1) / (m.target - 1)) * 100))
        : Math.min(100, (missionProgress / m.target) * 100);
      mBarEl.style.width = pct + '%';
    }

    function checkMissionAdvance(eatenType) {
      if (currentMissionIdx >= MISSIONS.length) return;
      const m = MISSIONS[currentMissionIdx];
      let advance = false;

      if (m.reqType === 'any') {
        missionProgress++;
        if (missionProgress >= m.target) advance = true;
      } else if (m.reqType === eatenType) {
        missionProgress++;
        if (missionProgress >= m.target) advance = true;
      } else if (m.reqType === 'scale') {
        if (catCurrentScale >= m.target) advance = true;
      }

      if (advance) {
        catTargetScale += m.reward;
        timeLeft += m.timeBonus;
        playMissionSound();
        mRewardTextEl.textContent = `+${m.timeBonus}s & +${Math.round(m.reward * 100)}% SIZE BOOST!`;
        mAlertEl.classList.add('show');
        setTimeout(() => mAlertEl.classList.remove('show'), 2500);

        currentMissionIdx++;
        missionProgress = 0;
      }
      updateMissionHUD();
    }

    function triggerGameOver(reason) {
      if (isGameOver) return;
      isGameOver = true;
      playGameOverSound();
      gameoverReason.textContent = reason;
      goScoreEl.textContent = score;
      gameoverMenu.classList.add('open');
    }

    function resetGameState() {
      catTargetScale = 1.0;
      catCurrentScale = 1.0;
      catGroup.scale.set(1, 1, 1);
      catGroup.position.set(0, 0, 0);
      score = 0;
      currentMissionIdx = 0;
      missionProgress = 0;
      timeLeft = 60;
      isGameOver = false;
      isPaused = false;
      updateMissionHUD();
      scoreValEl.textContent = '0';
      scaleValEl.textContent = '1.0x';
      timeValEl.textContent = '60s';
      gameoverMenu.classList.remove('open');
      pauseMenu.classList.remove('open');
    }

    updateMissionHUD();

    const uiLayer = document.getElementById('ui-layer');
    const scaleValEl = document.getElementById('scale-val');
    const scoreValEl = document.getElementById('score-val');

    function triggerFloatingText(text, x, y, isSpecial, isWarning) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      if (isWarning) el.style.color = '#ef4444';
      else if (isSpecial) el.style.color = '#facc15';
      uiLayer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    const touchReticle = document.getElementById('touch-reticle');
    const raycaster = new THREE.Raycaster();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    let isTouching = false;
    let targetWorldPos = new THREE.Vector3();
    const catVelocity = new THREE.Vector3();

    function getTouchPointOnPlane(clientX, clientY) {
      const ndc = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );
      raycaster.setFromCamera(ndc, camera);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, hit);
      return hit;
    }

    window.addEventListener('touchstart', (e) => {
      if (isPaused || isGameOver || e.target.closest('button') || e.target.closest('.modal-overlay')) return;
      e.preventDefault();
      isTouching = true;
      const t = e.touches[0];
      touchReticle.style.left = t.clientX + 'px';
      touchReticle.style.top = t.clientY + 'px';
      touchReticle.classList.add('active');
      const hit = getTouchPointOnPlane(t.clientX, t.clientY);
      if (hit) targetWorldPos.copy(hit);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isTouching || isPaused || isGameOver) return;
      e.preventDefault();
      const t = e.touches[0];
      touchReticle.style.left = t.clientX + 'px';
      touchReticle.style.top = t.clientY + 'px';
      const hit = getTouchPointOnPlane(t.clientX, t.clientY);
      if (hit) targetWorldPos.copy(hit);
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isTouching = false;
        touchReticle.classList.remove('active');
      }
    });

    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (isPaused || isGameOver || e.target.closest('button') || e.target.closest('.modal-overlay')) return;
      isMouseDown = true;
      touchReticle.style.left = e.clientX + 'px';
      touchReticle.style.top = e.clientY + 'px';
      touchReticle.classList.add('active');
      const hit = getTouchPointOnPlane(e.clientX, e.clientY);
      if (hit) targetWorldPos.copy(hit);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || isPaused || isGameOver) return;
      touchReticle.style.left = e.clientX + 'px';
      touchReticle.style.top = e.clientY + 'px';
      const hit = getTouchPointOnPlane(e.clientX, e.clientY);
      if (hit) targetWorldPos.copy(hit);
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      touchReticle.classList.remove('active');
    });

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    const pauseMenu = document.getElementById('pause-menu');
    document.getElementById('pause-btn').addEventListener('click', () => {
      if (isGameOver) return;
      isPaused = true;
      pauseMenu.classList.add('open');
    });
    document.getElementById('resume-btn').addEventListener('click', () => {
      isPaused = false;
      pauseMenu.classList.remove('open');
    });
    document.getElementById('reset-btn').addEventListener('click', resetGameState);
    document.getElementById('retry-btn').addEventListener('click', resetGameState);

    const clock = new THREE.Clock();
    let currentAnimMode = 'idle';

    function setAnimationState(mode) {
      if (currentAnimMode === mode) return;
      if (animActions[currentAnimMode]) animActions[currentAnimMode].fadeOut(0.2);
      if (animActions[mode]) {
        animActions[mode].reset().fadeIn(0.2).play();
      }
      currentAnimMode = mode;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      if (isPaused || isGameOver) return;

      if (catMixer) catMixer.update(delta);

      timeLeft -= delta;
      timeValEl.textContent = Math.max(0, Math.ceil(timeLeft)) + 's';
      if (timeLeft <= 0) {
        triggerGameOver("Time ran out before completing the mission!");
        return;
      }

      let moveDir = new THREE.Vector3();
      if (isTouching || isMouseDown) {
        const toTarget = new THREE.Vector3().subVectors(targetWorldPos, catGroup.position);
        toTarget.y = 0;
        const d = toTarget.length();
        if (d > 0.4) {
          moveDir.copy(toTarget.normalize());
          moveDir.multiplyScalar(Math.min(d * 2.8, 1.0));
        }
      } else {
        if (keys.w) moveDir.z -= 1;
        if (keys.s) moveDir.z += 1;
        if (keys.a) moveDir.x -= 1;
        if (keys.d) moveDir.x += 1;
        if (moveDir.lengthSq() > 0) moveDir.normalize();
      }

      const isMoving = moveDir.lengthSq() > 0.05;
      if (isMoving) {
        const dynamicSpeed = 12.0 + Math.sqrt(catCurrentScale) * 1.5;
        catVelocity.lerp(moveDir.multiplyScalar(dynamicSpeed), 0.18);
        catGroup.position.addScaledVector(catVelocity, delta);

        // Accurate forward rotation: facing movement vector directly
        const targetAngle = Math.atan2(catVelocity.x, catVelocity.z);
        let diff = targetAngle - catGroup.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        catGroup.rotation.y += diff * 0.22;

        if (isGltfLoaded) {
          setAnimationState(catVelocity.length() > 8 ? 'run' : 'walk');
        }
      } else {
        catVelocity.lerp(new THREE.Vector3(0, 0, 0), 0.2);

        if (isGltfLoaded) {
          setAnimationState('idle');
        }
      }

      floor.position.x = catGroup.position.x;
      floor.position.z = catGroup.position.z;
      const gridSize = floorSize / 120;
      grid.position.x = Math.floor(catGroup.position.x / gridSize) * gridSize;
      grid.position.z = Math.floor(catGroup.position.z / gridSize) * gridSize;

      dirLight.position.set(catGroup.position.x + 20, 35, catGroup.position.z + 25);
      dirLight.target = catGroup;

      if (eatingAnimTimer > 0) {
        eatingAnimTimer -= delta * 5.0;
        const chomp = Math.sin(eatingAnimTimer * Math.PI) * 0.35;
        if (catNeckBone) {
          catNeckBone.rotation.x = chomp * 0.45;
        }
      } else if (catNeckBone) {
        catNeckBone.rotation.x = 0;
      }

      catCurrentScale = THREE.MathUtils.lerp(catCurrentScale, catTargetScale, delta * 3.5);
      catGroup.scale.set(catCurrentScale, catCurrentScale, catCurrentScale);
      scaleValEl.textContent = catCurrentScale.toFixed(1) + 'x';

      const catPos = catGroup.position;
      const hitRadius = 1.25 * catCurrentScale;

      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.rotation.y += delta * 2;
        h.rotation.x += delta * 1.5;
        const d = Math.hypot(h.position.x - catPos.x, h.position.z - catPos.z);
        if (d < hitRadius + 0.5) {
          triggerGameOver("The cat hit a poisonous spike bomb!");
          return;
        } else if (d > SPAWN_RADIUS + 30) {
          scene.remove(h);
          hazards.splice(i, 1);
          spawnHazardNear(catPos.x, catPos.z);
        }
      }
      while (hazards.length < MAX_HAZARDS) {
        spawnHazardNear(catPos.x, catPos.z);
      }

      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        f.rotation.y += delta * 3;
        f.position.y = f.userData.baseY + Math.sin(clock.getElapsedTime() * 3 + i) * 0.2;

        const d = Math.hypot(f.position.x - catPos.x, f.position.z - catPos.z);
        if (d < hitRadius + (0.5 * f.userData.scale)) {
          const item = f.userData;
          playChompSound(item.type === 'large');

          catTargetScale += item.growthVal / (1 + (catTargetScale - 1) * 0.25);
          timeLeft += item.timeBonus;
          eatingAnimTimer = 1.0;

          score += item.type === 'large' ? 5 : (item.type === 'medium' ? 2 : 1);
          scoreValEl.textContent = score;

          const screenPos = f.position.clone().project(camera);
          const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;
          triggerFloatingText(`${item.text} (+${item.timeBonus}s)`, sx, sy, item.type === 'large', false);

          checkMissionAdvance(item.type);

          scene.remove(f);
          foods.splice(i, 1);
          spawnFoodNear(catPos.x, catPos.z);
        } else if (d > SPAWN_RADIUS + 25) {
          scene.remove(f);
          foods.splice(i, 1);
          spawnFoodNear(catPos.x, catPos.z);
        }
      }

      while (foods.length < MAX_FOODS) {
        spawnFoodNear(catPos.x, catPos.z);
      }

      if (MISSIONS[currentMissionIdx] && MISSIONS[currentMissionIdx].reqType === 'scale') {
        checkMissionAdvance('scale');
      }

      const desiredCamPos = new THREE.Vector3(
        catPos.x,
        catPos.y + (16 + catCurrentScale * 4.5),
        catPos.z + (20 + catCurrentScale * 6.0)
      );
      camera.position.lerp(desiredCamPos, 0.08);
      camera.lookAt(catPos.x, catPos.y + 1.0 * catCurrentScale, catPos.z);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
