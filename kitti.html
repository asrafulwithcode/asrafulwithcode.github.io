<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CAT SPINNERS: CHAOS MODE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060814;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px;
    }
    .hud-box {
      display: flex;
      gap: 10px;
    }
    .badge {
      background: rgba(13, 17, 38, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 8px 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .badge span {
      color: #4ade80;
    }
    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #touch-reticle {
      position: absolute;
      width: 38px;
      height: 38px;
      border: 2px solid rgba(147, 197, 253, 0.8);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s ease-out;
      z-index: 5;
    }
    #touch-reticle.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .float-text {
      position: absolute;
      color: #4ade80;
      font-weight: 900;
      font-size: 15px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
      25% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(0.9); }
    }
    #pause-menu {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 18, 0.85);
      backdrop-filter: blur(10px);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    #pause-menu.open {
      display: flex;
    }
    .menu-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 22px;
      border-radius: 18px;
      text-align: center;
      width: 260px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="touch-reticle"></div>

  <div id="ui-layer">
    <div class="hud-box">
      <div class="badge">Size: <span id="scale-val">1.0x</span></div>
      <div class="badge">Score: <span id="score-val">0</span></div>
    </div>
    <button class="btn" id="pause-btn">PAUSE</button>
  </div>

  <div id="pause-menu">
    <div class="menu-card">
      <h3 style="margin-bottom: 16px;">PAUSED</h3>
      <button class="btn" id="resume-btn" style="width: 100%; padding: 10px; margin-bottom: 8px; background: #2563eb;">RESUME</button>
      <button class="btn" id="reset-btn" style="width: 100%; padding: 10px;">RESET</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChompSound(isSpecial) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = isSpecial ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(isSpecial ? 650 : 480, now);
      osc.frequency.exponentialRampToValueAtTime(isSpecial ? 240 : 180, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060814);
    scene.fog = new THREE.FogExp2(0x060814, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 30, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(120, 40, 0x3b82f6, 0x1e293b);
    grid.position.y = 0.02;
    scene.add(grid);

    const catGroup = new THREE.Group();
    scene.add(catGroup);

    const furMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.5 });
    const whiteFurMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, roughness: 0.6 });
    const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.4 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x020617 });

    const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.95, 2.0, 16), furMat);
    bodyMesh.rotation.x = Math.PI / 2;
    bodyMesh.position.set(0, 1.0, 0);
    bodyMesh.castShadow = true;
    catGroup.add(bodyMesh);

    const bellyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.85, 1.4, 16, 1, false, 0, Math.PI), whiteFurMat);
    bellyMesh.rotation.x = Math.PI / 2;
    bellyMesh.rotation.y = Math.PI / 2;
    bellyMesh.position.set(0, 0.95, 0);
    catGroup.add(bellyMesh);

    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.4, 1.25);
    catGroup.add(headGroup);

    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.75, 16, 16), furMat);
    headMesh.castShadow = true;
    headGroup.add(headMesh);

    const muzzleMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), whiteFurMat);
    muzzleMesh.scale.set(1.1, 0.7, 0.9);
    muzzleMesh.position.set(0, -0.15, 0.65);
    headGroup.add(muzzleMesh);

    function createEye(x) {
      const g = new THREE.Group();
      g.position.set(x, 0.12, 0.62);
      const c = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), eyeMat);
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8), pupilMat);
      p.position.z = 0.09;
      g.add(c, p);
      return g;
    }
    headGroup.add(createEye(-0.3), createEye(0.3));

    function createEar(x, rotZ) {
      const g = new THREE.Group();
      g.position.set(x, 0.72, 0.1);
      g.rotation.z = rotZ;
      g.rotation.x = -0.15;
      const o = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.5, 5), furMat);
      const i = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.42, 5), innerEarMat);
      i.position.z = 0.05;
      g.add(o, i);
      return g;
    }
    headGroup.add(createEar(-0.4, 0.35), createEar(0.4, -0.35));

    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 1.2, -1.0);
    catGroup.add(tailGroup);

    const tailJoints = [];
    let pNode = tailGroup;
    for (let i = 0; i < 4; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.45, 8), i % 2 === 0 ? furMat : whiteFurMat);
      s.position.y = 0.2;
      const j = new THREE.Group();
      j.position.y = 0.35;
      j.add(s);
      pNode.add(j);
      tailJoints.push(j);
      pNode = j;
    }

    const legs = [];
    const legGeo = new THREE.CylinderGeometry(0.2, 0.16, 0.9, 10);
    [
      { x: -0.55, z: 0.65 },
      { x: 0.55, z: 0.65 },
      { x: -0.55, z: -0.65 },
      { x: 0.55, z: -0.65 }
    ].forEach((pos) => {
      const g = new THREE.Group();
      g.position.set(pos.x, 0.75, pos.z);
      const m = new THREE.Mesh(legGeo, furMat);
      m.position.y = -0.3;
      m.castShadow = true;
      g.add(m);
      catGroup.add(g);
      legs.push(g);
    });

    let catCurrentScale = 1.0;
    let catTargetScale = 1.0;
    let eatingAnimTimer = 0;
    let score = 0;

    const foods = [];
    const MAX_FOODS = 18;

    const FOOD_TYPES = [
      { type: 'small', color: 0x38bdf8, scale: 0.7, growthVal: 0.06, text: '+Size' },
      { type: 'medium', color: 0xfacc15, scale: 1.0, growthVal: 0.12, text: '+Grow' },
      { type: 'large', color: 0xf43f5e, scale: 1.5, growthVal: 0.25, text: 'MEGA' }
    ];

    function createFoodMesh(def) {
      const g = new THREE.Group();
      const b = new THREE.Mesh(
        new THREE.ConeGeometry(0.35 * def.scale, 0.9 * def.scale, 7),
        new THREE.MeshStandardMaterial({ color: def.color, emissive: def.color, emissiveIntensity: 0.25 })
      );
      b.rotation.z = Math.PI / 2;
      g.add(b);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.55 * def.scale, 0.65 * def.scale, 16),
        new THREE.MeshBasicMaterial({ color: def.color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -0.2;
      g.add(ring);

      g.userData = { ...def, ringMesh: ring, baseY: 0.8 * def.scale };
      return g;
    }

    function spawnFood() {
      const r = Math.random();
      let def = FOOD_TYPES[0];
      if (r > 0.88) def = FOOD_TYPES[2];
      else if (r > 0.60) def = FOOD_TYPES[1];

      const f = createFoodMesh(def);
      const a = Math.random() * Math.PI * 2;
      const d = 5 + Math.random() * 38;
      f.position.set(Math.cos(a) * d, f.userData.baseY, Math.sin(a) * d);
      scene.add(f);
      foods.push(f);
    }

    for (let i = 0; i < MAX_FOODS; i++) spawnFood();

    const uiLayer = document.getElementById('ui-layer');
    const scaleValEl = document.getElementById('scale-val');
    const scoreValEl = document.getElementById('score-val');

    function triggerFloatingText(text, x, y, isSpecial) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      if (isSpecial) el.style.color = '#facc15';
      uiLayer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    const touchReticle = document.getElementById('touch-reticle');
    const raycaster = new THREE.Raycaster();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    let isTouching = false;
    let targetWorldPos = new THREE.Vector3();
    const catVelocity = new THREE.Vector3();
    let isPaused = false;

    function getTouchPointOnPlane(clientX, clientY) {
      const ndc = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );
      raycaster.setFromCamera(ndc, camera);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, hit);
      return hit;
    }

    window.addEventListener('touchstart', (e) => {
      if (isPaused || e.target.closest('button') || e.target.closest('#pause-menu')) return;
      e.preventDefault();
      isTouching = true;
      const t = e.touches[0];
      touchReticle.style.left = t.clientX + 'px';
      touchReticle.style.top = t.clientY + 'px';
      touchReticle.classList.add('active');
      const hit = getTouchPointOnPlane(t.clientX, t.clientY);
      if (hit) targetWorldPos.copy(hit);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isTouching || isPaused) return;
      e.preventDefault();
      const t = e.touches[0];
      touchReticle.style.left = t.clientX + 'px';
      touchReticle.style.top = t.clientY + 'px';
      const hit = getTouchPointOnPlane(t.clientX, t.clientY);
      if (hit) targetWorldPos.copy(hit);
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isTouching = false;
        touchReticle.classList.remove('active');
      }
    });

    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (isPaused || e.target.closest('button') || e.target.closest('#pause-menu')) return;
      isMouseDown = true;
      touchReticle.style.left = e.clientX + 'px';
      touchReticle.style.top = e.clientY + 'px';
      touchReticle.classList.add('active');
      const hit = getTouchPointOnPlane(e.clientX, e.clientY);
      if (hit) targetWorldPos.copy(hit);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || isPaused) return;
      touchReticle.style.left = e.clientX + 'px';
      touchReticle.style.top = e.clientY + 'px';
      const hit = getTouchPointOnPlane(e.clientX, e.clientY);
      if (hit) targetWorldPos.copy(hit);
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      touchReticle.classList.remove('active');
    });

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    const pauseMenu = document.getElementById('pause-menu');
    document.getElementById('pause-btn').addEventListener('click', () => {
      isPaused = true;
      pauseMenu.classList.add('open');
    });
    document.getElementById('resume-btn').addEventListener('click', () => {
      isPaused = false;
      pauseMenu.classList.remove('open');
    });
    document.getElementById('reset-btn').addEventListener('click', () => {
      catTargetScale = 1.0;
      catCurrentScale = 1.0;
      catGroup.scale.set(1, 1, 1);
      score = 0;
      scoreValEl.textContent = '0';
      scaleValEl.textContent = '1.0x';
      isPaused = false;
      pauseMenu.classList.remove('open');
    });

    const clock = new THREE.Clock();
    let walkCycle = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      if (isPaused) return;

      let moveDir = new THREE.Vector3();
      if (isTouching || isMouseDown) {
        const toTarget = new THREE.Vector3().subVectors(targetWorldPos, catGroup.position);
        toTarget.y = 0;
        const d = toTarget.length();
        if (d > 0.4) {
          moveDir.copy(toTarget.normalize());
          moveDir.multiplyScalar(Math.min(d * 2.8, 1.0));
        }
      } else {
        if (keys.w) moveDir.z -= 1;
        if (keys.s) moveDir.z += 1;
        if (keys.a) moveDir.x -= 1;
        if (keys.d) moveDir.x += 1;
        if (moveDir.lengthSq() > 0) moveDir.normalize();
      }

      const isMoving = moveDir.lengthSq() > 0.05;
      if (isMoving) {
        catVelocity.lerp(moveDir.multiplyScalar(12.0), 0.18);
        catGroup.position.addScaledVector(catVelocity, delta);

        const targetAngle = Math.atan2(catVelocity.x, catVelocity.z);
        let diff = targetAngle - catGroup.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        catGroup.rotation.y += diff * 0.22;

        walkCycle += delta * (12 + catCurrentScale);
      } else {
        catVelocity.lerp(new THREE.Vector3(0, 0, 0), 0.2);
        walkCycle += delta * 2;
      }

      const curDist = Math.hypot(catGroup.position.x, catGroup.position.z);
      if (curDist > 44) catGroup.position.setLength(43.9);

      legs.forEach((leg, idx) => {
        const offset = idx % 2 === 0 ? 0 : Math.PI;
        leg.rotation.x = isMoving ? Math.sin(walkCycle + offset) * 0.6 : 0;
      });

      const wagAngle = Math.sin(walkCycle * 1.5) * 0.25;
      tailJoints.forEach((j) => {
        j.rotation.y = wagAngle;
      });

      if (eatingAnimTimer > 0) {
        eatingAnimTimer -= delta * 5.0;
        const chomp = Math.sin(eatingAnimTimer * Math.PI) * 0.35;
        headGroup.scale.set(1 + chomp, 1 - chomp * 0.5, 1 + chomp);
      } else {
        headGroup.scale.set(1, 1, 1);
      }

      catCurrentScale = THREE.MathUtils.lerp(catCurrentScale, catTargetScale, delta * 3.5);
      catGroup.scale.set(catCurrentScale, catCurrentScale, catCurrentScale);
      scaleValEl.textContent = catCurrentScale.toFixed(1) + 'x';

      const catPos = catGroup.position;
      const hitRadius = 1.15 * catCurrentScale;

      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        f.rotation.y += delta * 3;
        f.position.y = f.userData.baseY + Math.sin(clock.getElapsedTime() * 3 + i) * 0.2;

        const d = Math.hypot(f.position.x - catPos.x, f.position.z - catPos.z);
        if (d < hitRadius + (0.5 * f.userData.scale)) {
          const item = f.userData;
          playChompSound(item.type === 'large');

          catTargetScale += item.growthVal / (1 + (catTargetScale - 1) * 0.25);
          eatingAnimTimer = 1.0;

          score += item.type === 'large' ? 5 : (item.type === 'medium' ? 2 : 1);
          scoreValEl.textContent = score;

          const screenPos = f.position.clone().project(camera);
          const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;
          triggerFloatingText(item.text, sx, sy, item.type === 'large');

          scene.remove(f);
          foods.splice(i, 1);
          setTimeout(spawnFood, 1200 + Math.random() * 1500);
        }
      }

      const desiredCamPos = new THREE.Vector3(
        catPos.x,
        catPos.y + (16 + catCurrentScale * 4.5),
        catPos.z + (20 + catCurrentScale * 6.0)
      );
      camera.position.lerp(desiredCamPos, 0.08);
      camera.lookAt(catPos.x, catPos.y + 1.0 * catCurrentScale, catPos.z);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
