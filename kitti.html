<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CAT SPINNERS: CHAOS MODE</title>
    <!-- Updated Three.js bundle supporting modern geometries like CapsuleGeometry -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .stat-card {
            background: rgba(15, 15, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 18px;
            backdrop-filter: blur(8px);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a8d9b;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Special / Chaos Meter */
        #special-card {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(8px);
        }

        .cooldown-bar-bg {
            width: 140px;
            height: 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            overflow: hidden;
        }

        #cooldown-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.1s linear;
        }

        /* Menu Overlay */
        .menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            z-index: 20;
        }

        .game-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffedd5, #f43f5e, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-subtitle {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #38bdf8;
            margin-bottom: 24px;
        }

        .game-desc {
            max-width: 360px;
            font-size: 14px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .btn-chaos {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            border: none;
            outline: none;
            padding: 14px 42px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-chaos:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(99, 102, 241, 0.8);
        }

        .btn-chaos:active {
            transform: scale(0.98);
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: calc(100% - 40px);
            display: none;
            justify-content: space-between;
            z-index: 12;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-card">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score-display">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Radial Speed</div>
                <div class="stat-value" id="speed-display">1.0x</div>
            </div>
        </div>

        <div id="special-card">
            <span style="font-size: 11px; letter-spacing: 1px; color: #cbd5e1; font-weight: 700;">BURST [SPACE]</span>
            <div class="cooldown-bar-bg">
                <div id="cooldown-bar"></div>
            </div>
        </div>

        <div id="mobile-controls">
            <div class="control-group">
                <button class="touch-btn" id="btn-left">&larr;</button>
                <button class="touch-btn" id="btn-right">&rarr;</button>
            </div>
            <div class="control-group">
                <button class="touch-btn" id="btn-burst" style="width: 70px; border-radius: 16px; font-size: 12px;">BURST</button>
            </div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div class="menu-overlay" id="start-overlay">
        <div class="game-title">CAT SPINNERS</div>
        <div class="game-subtitle">CHAOS MODE</div>
        <p class="game-desc">
            Rotate the cosmic radial cat ring to collect bright energy orbs and dodge oncoming void anomalies.
            Use <b>[A / D]</b> or <b>[Arrow Keys]</b> to spin, and <b>[SPACE]</b> for Chaos Burst.
        </p>
        <button class="btn-chaos interactive" id="start-btn">START CHAOS</button>
    </div>

    <!-- Game Over Overlay -->
    <div class="menu-overlay" id="game-over-overlay" style="display: none;">
        <div class="game-title" style="background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text;">RING COLLAPSED</div>
        <div class="game-subtitle" id="final-score-display" style="color: #f87171; margin-bottom: 28px;">SCORE: 0</div>
        <button class="btn-chaos interactive" id="restart-btn">SPIN AGAIN</button>
    </div>

    <script>
        // Polyfill safeguard if running in an environment without CapsuleGeometry
        if (typeof THREE !== 'undefined' && !THREE.CapsuleGeometry) {
            THREE.CapsuleGeometry = function(radius, length, capSegments, radialSegments) {
                return new THREE.CylinderGeometry(radius || 0.5, radius || 0.5, length || 1, radialSegments || 16);
            };
        }

        // --- Core Game Variables ---
        let scene, camera, renderer;
        let catGroup, orbs = [], hazards = [], particles = [];
        let score = 0, gameActive = false;
        let catAngle = 0;
        let spinVelocity = 0;
        let burstEnergy = 100;
        let isBursting = false;
        const ringRadius = 7.5;

        const keys = { left: false, right: false, space: false };

        const canvas = document.getElementById('game-canvas');
        const scoreDisplay = document.getElementById('score-display');
        const speedDisplay = document.getElementById('speed-display');
        const cooldownBar = document.getElementById('cooldown-bar');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const finalScoreDisplay = document.getElementById('final-score-display');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Check mobile touch support
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('mobile-controls').style.display = 'flex';
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.035);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 15);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const directLight = new THREE.DirectionalLight(0xfff, 1.2);
            directLight.position.set(5, 10, 8);
            scene.add(directLight);

            // Orbit Ring Visual Guide
            const ringGeo = new THREE.RingGeometry(ringRadius - 0.05, ringRadius + 0.05, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
            const orbitGuide = new THREE.Mesh(ringGeo, ringMat);
            scene.add(orbitGuide);

            // Background Starfield particles
            const starGeo = new THREE.BufferGeometry();
            const starCoords = [];
            for (let i = 0; i < 600; i++) {
                starCoords.push(
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 40 - 10
                );
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
            const starMat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.15, transparent: true, opacity: 0.8 });
            const starField = new THREE.Points(starGeo, starMat);
            scene.add(starField);

            create3DCat();
        }

        // Cat Mesh Builder
        function create3DCat() {
            catGroup = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4 });
            const earMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, roughness: 0.3 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

            // Body
            const bodyGeo = new THREE.CapsuleGeometry(0.5, 0.7, 8, 16);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.z = Math.PI / 2;
            catGroup.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0.65, 0.15, 0);
            catGroup.add(head);

            // Ears
            const earGeo = new THREE.ConeGeometry(0.2, 0.4, 4);
            const leftEar = new THREE.Mesh(earGeo, earMat);
            leftEar.position.set(0.65, 0.65, 0.22);
            leftEar.rotation.x = 0.2;
            catGroup.add(leftEar);

            const rightEar = new THREE.Mesh(earGeo, earMat);
            rightEar.position.set(0.65, 0.65, -0.22);
            rightEar.rotation.x = -0.2;
            catGroup.add(rightEar);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(0.95, 0.22, 0.18);
            catGroup.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.95, 0.22, -0.18);
            catGroup.add(rightEye);

            // Tail
            const tailGeo = new THREE.CylinderGeometry(0.1, 0.14, 0.9, 8);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(-0.8, 0.4, 0);
            tail.rotation.z = -Math.PI / 3;
            catGroup.add(tail);

            catGroup.scale.set(0.9, 0.9, 0.9);
            scene.add(catGroup);
            updateCatPosition();
        }

        function updateCatPosition() {
            catGroup.position.x = Math.cos(catAngle) * ringRadius;
            catGroup.position.y = Math.sin(catAngle) * ringRadius;
            catGroup.rotation.z = catAngle + Math.PI / 2;
        }

        // Spawn Mechanics
        function spawnOrb() {
            const angle = Math.random() * Math.PI * 2;
            const geo = new THREE.SphereGeometry(0.35, 16, 16);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                emissive: 0x0284c7,
                emissiveIntensity: 0.9
            });
            const orb = new THREE.Mesh(geo, mat);
            orb.userData = { angle: angle, zPos: -35, speed: 0.18 + Math.random() * 0.08 };
            scene.add(orb);
            orbs.push(orb);
        }

        function spawnHazard() {
            const angle = Math.random() * Math.PI * 2;
            const geo = new THREE.DodecahedronGeometry(0.5, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xef4444,
                emissive: 0xb91c1c,
                emissiveIntensity: 0.8,
                roughness: 0.2
            });
            const hazard = new THREE.Mesh(geo, mat);
            hazard.userData = {
                angle: angle,
                zPos: -40,
                speed: 0.22 + Math.random() * 0.12,
                rotSpeedX: Math.random() * 0.05,
                rotSpeedY: Math.random() * 0.05
            };
            scene.add(hazard);
            hazards.push(hazard);
        }

        // Particle Burst on Collect
        function triggerCollectEffect(pos, colorHex) {
            const pCount = 12;
            const geo = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            for (let i = 0; i < pCount; i++) {
                positions.push(pos.x, pos.y, pos.z);
                velocities.push(
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3
                );
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: colorHex, size: 0.2, transparent: true, opacity: 1 });
            const pMesh = new THREE.Points(geo, mat);
            pMesh.userData = { velocities: velocities, life: 1.0 };
            scene.add(pMesh);
            particles.push(pMesh);
        }

        function startGame() {
            score = 0;
            catAngle = 0;
            spinVelocity = 0;
            burstEnergy = 100;
            scoreDisplay.textContent = '0';
            speedDisplay.textContent = '1.0x';

            // Clean previous objects
            orbs.forEach(o => scene.remove(o));
            hazards.forEach(h => scene.remove(h));
            particles.forEach(p => scene.remove(p));
            orbs = [];
            hazards = [];
            particles = [];

            startOverlay.style.display = 'none';
            gameOverOverlay.style.display = 'none';
            gameActive = true;
        }

        function gameOver() {
            gameActive = false;
            finalScoreDisplay.textContent = `SCORE: ${score}`;
            gameOverOverlay.style.display = 'flex';
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.code === 'Space') keys.space = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Touch button controls
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnBurst = document.getElementById('btn-burst');

        const bindTouch = (elem, keyName) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        };
        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnBurst, 'space');

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Main Game Loop ---
        let lastSpawnOrb = 0;
        let lastSpawnHazard = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (gameActive) {
                // Controls handling
                const accel = 0.0035;
                if (keys.left) spinVelocity += accel;
                if (keys.right) spinVelocity -= accel;

                // Friction
                spinVelocity *= 0.93;
                catAngle += spinVelocity;

                // Chaos Burst logic
                if (keys.space && burstEnergy > 0) {
                    isBursting = true;
                    burstEnergy = Math.max(0, burstEnergy - 1.2);
                    catGroup.scale.set(1.2, 1.2, 1.2);
                } else {
                    isBursting = false;
                    burstEnergy = Math.min(100, burstEnergy + 0.25);
                    catGroup.scale.set(0.9, 0.9, 0.9);
                }
                cooldownBar.style.width = `${burstEnergy}%`;

                updateCatPosition();

                // Spawning items
                if (timestamp - lastSpawnOrb > 900) {
                    spawnOrb();
                    lastSpawnOrb = timestamp;
                }
                if (timestamp - lastSpawnHazard > 1400) {
                    spawnHazard();
                    lastSpawnHazard = timestamp;
                }

                // Update Energy Orbs
                for (let i = orbs.length - 1; i >= 0; i--) {
                    const orb = orbs[i];
                    orb.userData.zPos += orb.userData.speed;
                    orb.position.x = Math.cos(orb.userData.angle) * ringRadius;
                    orb.position.y = Math.sin(orb.userData.angle) * ringRadius;
                    orb.position.z = orb.userData.zPos;

                    // Proximity check on ring plane (z around 0)
                    if (Math.abs(orb.position.z) < 0.6) {
                        const dist = Math.abs(catAngle - orb.userData.angle) % (Math.PI * 2);
                        const angleDiff = Math.min(dist, Math.PI * 2 - dist);

                        if (angleDiff < 0.28) {
                            score += 10;
                            scoreDisplay.textContent = score;
                            triggerCollectEffect(orb.position, 0x38bdf8);
                            scene.remove(orb);
                            orbs.splice(i, 1);
                            continue;
                        }
                    }

                    if (orb.position.z > 5) {
                        scene.remove(orb);
                        orbs.splice(i, 1);
                    }
                }

                // Update Hazards
                for (let i = hazards.length - 1; i >= 0; i--) {
                    const h = hazards[i];
                    h.userData.zPos += h.userData.speed;
                    h.position.x = Math.cos(h.userData.angle) * ringRadius;
                    h.position.y = Math.sin(h.userData.angle) * ringRadius;
                    h.position.z = h.userData.zPos;
                    h.rotation.x += h.userData.rotSpeedX;
                    h.rotation.y += h.userData.rotSpeedY;

                    if (Math.abs(h.position.z) < 0.6) {
                        const dist = Math.abs(catAngle - h.userData.angle) % (Math.PI * 2);
                        const angleDiff = Math.min(dist, Math.PI * 2 - dist);

                        if (angleDiff < 0.25) {
                            if (isBursting) {
                                // Destroy hazard safely during Chaos burst
                                score += 25;
                                scoreDisplay.textContent = score;
                                triggerCollectEffect(h.position, 0xf59e0b);
                                scene.remove(h);
                                hazards.splice(i, 1);
                                continue;
                            } else {
                                triggerCollectEffect(h.position, 0xef4444);
                                gameOver();
                                break;
                            }
                        }
                    }

                    if (h.position.z > 5) {
                        scene.remove(h);
                        hazards.splice(i, 1);
                    }
                }

                // Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.userData.life -= 0.035;
                    p.material.opacity = p.userData.life;
                    const pos = p.geometry.attributes.position.array;
                    const vels = p.userData.velocities;
                    for (let j = 0; j < vels.length / 3; j++) {
                        pos[j * 3] += vels[j * 3];
                        pos[j * 3 + 1] += vels[j * 3 + 1];
                        pos[j * 3 + 2] += vels[j * 3 + 2];
                    }
                    p.geometry.attributes.position.needsUpdate = true;

                    if (p.userData.life <= 0) {
                        scene.remove(p);
                        particles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Initialize and start animation
        initScene();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
